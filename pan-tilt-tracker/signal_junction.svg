<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arO" markerWidth="12" markerHeight="12" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#e8820c"/></marker>
    <style>
      .ttl{font-size:24px;font-weight:800;fill:#1c2330}
      .sub{font-size:15px;fill:#5a6577}
      .lbl{font-size:15px;fill:#1c2330}
      .lblb{font-size:16px;font-weight:700;fill:#1c2330}
      .sm{font-size:13px;fill:#6a7385}
      .cu{stroke:#c8772e;stroke-width:5;fill:none}
      .sig{stroke:#e8820c;stroke-width:5;fill:none}
      .res{fill:#fff7e6;stroke:#d8a72e;stroke-width:2}
    </style>
  </defs>
  <rect x="0" y="0" width="1060" height="660" fill="#fcfcfe"/>
  <text x="40" y="46" class="ttl">Узел Signal на WAGO — как соединить белый провод с ESP32</text>
  <text x="40" y="72" class="sub">В один WAGO: белый от сервы + 2 медных. Медный A → через столбик ≈1 кОм → G17.  Медный B → напрямую → G16.</text>

  <!-- ESP32 partial board -->
  <rect x="60" y="170" width="160" height="360" rx="14" fill="#222b39" stroke="#0d1119" stroke-width="2.5"/>
  <rect x="72" y="182" width="136" height="336" rx="8" fill="#2c3849"/>
  <text x="140" y="218" font-size="16" font-weight="700" fill="#eaf0f8" text-anchor="middle">ESP32</text>

  <line x1="220" y1="270" x2="252" y2="270" class="sig"/>
  <rect x="118" y="258" width="94" height="24" rx="5" fill="#fff1df" stroke="#e8820c"/>
  <text x="165" y="275" font-size="13" font-weight="800" fill="#b8650a" text-anchor="middle">G17 · TX2</text>

  <line x1="220" y1="360" x2="252" y2="360" class="sig"/>
  <rect x="118" y="348" width="94" height="24" rx="5" fill="#fff1df" stroke="#e8820c"/>
  <text x="165" y="365" font-size="13" font-weight="800" fill="#b8650a" text-anchor="middle">G16 · RX2</text>

  <rect x="118" y="450" width="94" height="24" rx="5" fill="#3a4658" stroke="#5a6577"/>
  <text x="165" y="467" font-size="12" fill="#aab4c4" text-anchor="middle">GND (отдельно)</text>

  <!-- resistor chain (G17 -> WAGO copper A) -->
  <polyline class="cu" points="252,270 280,270 280,300 300,300"/>
  <g>
    <rect x="300" y="288" width="42" height="24" rx="4" class="res"/><text x="321" y="305" font-size="10" text-anchor="middle" fill="#8a6a16">220</text>
    <line x1="342" y1="300" x2="350" y2="300" class="cu"/>
    <rect x="350" y="288" width="42" height="24" rx="4" class="res"/><text x="371" y="305" font-size="10" text-anchor="middle" fill="#8a6a16">220</text>
    <line x1="392" y1="300" x2="400" y2="300" class="cu"/>
    <rect x="400" y="288" width="42" height="24" rx="4" class="res"/><text x="421" y="305" font-size="10" text-anchor="middle" fill="#8a6a16">220</text>
    <line x1="442" y1="300" x2="450" y2="300" class="cu"/>
    <rect x="450" y="288" width="42" height="24" rx="4" class="res"/><text x="471" y="305" font-size="10" text-anchor="middle" fill="#8a6a16">220</text>
    <line x1="492" y1="300" x2="500" y2="300" class="cu"/>
    <rect x="500" y="288" width="42" height="24" rx="4" class="res"/><text x="521" y="305" font-size="10" text-anchor="middle" fill="#8a6a16">220</text>
  </g>
  <polyline class="cu" points="542,300 560,300"/>
  <text x="421" y="278" font-size="13" font-weight="700" fill="#8a6a16" text-anchor="middle">медный A · столбик 5×220 = ≈1.1 кОм</text>

  <!-- G16 -> WAGO copper B -->
  <polyline class="cu" points="252,360 430,360 430,395 560,395"/>
  <text x="320" y="352" class="sm" fill="#c8772e">медный B · напрямую</text>

  <!-- WAGO (the junction) -->
  <rect x="560" y="255" width="150" height="180" rx="12" fill="#d3d8df" stroke="#8a93a3" stroke-width="2.5"/>
  <rect x="575" y="246" width="26" height="16" rx="3" fill="#e8820c"/>
  <rect x="612" y="246" width="26" height="16" rx="3" fill="#e8820c"/>
  <rect x="649" y="246" width="26" height="16" rx="3" fill="#e8820c"/>
  <text x="635" y="330" class="lblb" text-anchor="middle">WAGO</text>
  <text x="635" y="352" class="sm" text-anchor="middle">узел Signal</text>
  <text x="635" y="372" class="sm" text-anchor="middle">(3 провода</text>
  <text x="635" y="390" class="sm" text-anchor="middle">соединены вместе)</text>
  <!-- holes -->
  <circle cx="560" cy="300" r="5" fill="#3a4658"/>
  <circle cx="560" cy="395" r="5" fill="#3a4658"/>
  <circle cx="710" cy="345" r="5" fill="#3a4658"/>

  <!-- white wire WAGO -> servo -->
  <polyline class="sig" points="710,345 830,345" marker-end="url(#arO)"/>
  <text x="772" y="333" class="sm" fill="#b8650a" text-anchor="middle">белый (Signal)</text>

  <!-- servo -->
  <rect x="830" y="285" width="160" height="120" rx="12" fill="#fff3d6" stroke="#e0a030" stroke-width="2.5"/>
  <text x="910" y="318" class="lblb" text-anchor="middle">STS3215</text>
  <text x="910" y="340" class="sm" text-anchor="middle">PAN (ID 1)</text>
  <circle cx="910" cy="374" r="16" fill="#e0a030"/><circle cx="910" cy="374" r="6" fill="#fff"/>

  <!-- note about power & 3 WAGO -->
  <rect x="60" y="556" width="930" height="74" rx="10" fill="#eef3fb" stroke="#b9cbe6" stroke-width="2"/>
  <text x="80" y="582" class="lbl"><tspan font-weight="700">Всего 3 отдельных WAGO:</tspan>  ① +7.4 В (OUT+ и красный сервы)   ② GND — общая земля (OUT−, чёрный сервы, GND ESP32)   ③ Signal (этот).</text>
  <text x="80" y="606" class="sm">Красный и чёрный провода сервы сюда НЕ заходят — у них свои WAGO (① и ②). Резистор без полярности — каким концом куда, неважно.</text>
</svg>
