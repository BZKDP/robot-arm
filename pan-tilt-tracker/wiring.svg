<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d63b2f"/>
    </marker>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
    <style>
      .ttl{font-size:22px;font-weight:700;fill:#222}
      .pnl{font-size:16px;font-weight:700;fill:#555}
      .lbl{font-size:13px;fill:#222}
      .sm{font-size:11px;fill:#666}
      .wlbl{font-size:11px;font-weight:700}
      .box{stroke-width:2;rx:8}
      .red{stroke:#d63b2f;stroke-width:3;fill:none}
      .blk{stroke:#333;stroke-width:3;fill:none}
      .sig{stroke:#e8820c;stroke-width:3;fill:none}
      .wifi{stroke:#2e9e5b;stroke-width:3;fill:none;stroke-dasharray:7 5}
      .usb{stroke:#8a8f98;stroke-width:3;fill:none}
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="1080" fill="#fbfbfd"/>
  <text x="30" y="40" class="ttl">Pan-Tilt трекер · сборка и подключение (STS3215 + ESP32-CAM + ПК)</text>

  <!-- ============ LEFT: MECHANICS ============ -->
  <rect x="24" y="64" width="350" height="970" fill="#f4f6fa" stroke="#d7dde6" class="box"/>
  <text x="199" y="92" class="pnl" text-anchor="middle">МЕХАНИКА · оси (снизу вверх)</text>

  <!-- stack blocks bottom->top -->
  <g text-anchor="middle">
    <rect x="49" y="900" width="300" height="54" fill="#e9ecf1" stroke="#b9c2cf" class="box"/>
    <text x="199" y="932" class="lbl">Стол / штатив</text>

    <rect x="49" y="810" width="300" height="54" fill="#eef3ec" stroke="#a9c39e" class="box"/>
    <text x="199" y="842" class="lbl">base_link — основание</text>

    <rect x="49" y="720" width="300" height="54" fill="#fff3d6" stroke="#e0a030" class="box"/>
    <text x="199" y="745" class="lbl">STS3215 PAN · ID 1</text>
    <text x="199" y="763" class="sm">поворот ⟲ (рысканье)</text>

    <rect x="49" y="630" width="300" height="54" fill="#eef3ec" stroke="#a9c39e" class="box"/>
    <text x="199" y="662" class="lbl">pan_tilt_bracket — П-скоба</text>

    <rect x="49" y="540" width="300" height="54" fill="#fff3d6" stroke="#e0a030" class="box"/>
    <text x="199" y="565" class="lbl">STS3215 TILT · ID 2</text>
    <text x="199" y="583" class="sm">наклон ⟳ (тангаж)</text>

    <rect x="49" y="450" width="300" height="54" fill="#eef3ec" stroke="#a9c39e" class="box"/>
    <text x="199" y="482" class="lbl">payload_link — площадка</text>

    <rect x="49" y="360" width="300" height="54" fill="#eef3ec" stroke="#a9c39e" class="box"/>
    <text x="199" y="385" class="lbl">Корпус ESP32-CAM</text>
    <text x="199" y="403" class="sm">front + back</text>

    <rect x="49" y="270" width="300" height="54" fill="#e8f0ff" stroke="#5b86c9" class="box"/>
    <text x="199" y="302" class="lbl">ESP32-CAM 📷</text>
  </g>
  <!-- up arrows -->
  <g stroke="#8a93a3" stroke-width="2" marker-end="url(#ar)">
    <line x1="199" y1="900" x2="199" y2="868"/>
    <line x1="199" y1="810" x2="199" y2="778"/>
    <line x1="199" y1="720" x2="199" y2="688"/>
    <line x1="199" y1="630" x2="199" y2="598"/>
    <line x1="199" y1="540" x2="199" y2="508"/>
    <line x1="199" y1="450" x2="199" y2="418"/>
    <line x1="199" y1="360" x2="199" y2="328"/>
  </g>

  <!-- ============ RIGHT: ELECTRICAL ============ -->
  <rect x="392" y="64" width="1024" height="970" fill="#ffffff" stroke="#d7dde6" class="box"/>
  <text x="904" y="92" class="pnl" text-anchor="middle">ЭЛЕКТРИКА · подключение</text>

  <!-- power input chain -->
  <g text-anchor="middle">
    <rect x="412" y="120" width="86" height="50" fill="#eef1f5" stroke="#aeb7c4" class="box"/>
    <text x="455" y="142" class="lbl">220 В</text><text x="455" y="159" class="sm">розетка</text>

    <rect x="528" y="120" width="104" height="50" fill="#eef1f5" stroke="#aeb7c4" class="box"/>
    <text x="580" y="142" class="lbl">БП 12 В</text><text x="580" y="159" class="sm">3 А, бочонок</text>

    <rect x="662" y="120" width="128" height="50" fill="#eef1f5" stroke="#aeb7c4" class="box"/>
    <text x="726" y="140" class="lbl">адаптер</text><text x="726" y="158" class="sm">бочонок→клеммы</text>

    <rect x="820" y="110" width="132" height="72" fill="#e9f7ee" stroke="#4cae72" stroke-width="2.5" class="box"/>
    <text x="886" y="132" class="lbl">LM2596</text>
    <text x="886" y="150" class="sm">12 В → 7.4 В</text>
    <text x="886" y="170" style="font-size:11px;font-weight:700;fill:#d63b2f">⚙ выставить 7.4 В!</text>
  </g>
  <!-- chain arrows -->
  <g class="blk" marker-end="url(#ar)" stroke="#8a93a3">
    <line x1="498" y1="145" x2="526" y2="145"/>
    <line x1="632" y1="145" x2="660" y2="145"/>
    <line x1="790" y1="145" x2="818" y2="145"/>
  </g>

  <!-- WAGO rails -->
  <rect x="640" y="240" width="180" height="30" fill="#fbe6e3" stroke="#d63b2f" class="box"/>
  <text x="730" y="260" class="wlbl" fill="#a82a20" text-anchor="middle">WAGO  ·  +7.4 В</text>
  <rect x="640" y="284" width="180" height="30" fill="#e6e8ea" stroke="#333" class="box"/>
  <text x="730" y="304" class="wlbl" fill="#222" text-anchor="middle">WAGO  ·  GND (общая)</text>

  <!-- LM2596 OUT -> WAGO -->
  <polyline class="red" points="855,182 855,210 730,210 730,240" marker-end="url(#arR)"/>
  <polyline class="blk" points="912,182 912,224 818,224 818,284 738,284" marker-end="url(#arB)"/>
  <text x="940" y="205" class="sm" fill="#d63b2f">OUT+ 7.4В</text>
  <text x="930" y="244" class="sm">OUT−</text>

  <!-- SERVOS -->
  <g text-anchor="middle">
    <rect x="1150" y="150" width="180" height="92" fill="#fff3d6" stroke="#e0a030" stroke-width="2.5" class="box"/>
    <text x="1240" y="178" class="lbl">STS3215 PAN</text>
    <text x="1240" y="198" class="sm">ID 1 · основание</text>
    <text x="1240" y="224" class="sm">VIN · GND · Signal</text>

    <rect x="1150" y="300" width="180" height="92" fill="#fff3d6" stroke="#e0a030" stroke-width="2.5" class="box"/>
    <text x="1240" y="328" class="lbl">STS3215 TILT</text>
    <text x="1240" y="348" class="sm">ID 2 · на роге pan</text>
    <text x="1240" y="374" class="sm">VIN · GND · Signal</text>
  </g>
  <!-- daisy chain pan->tilt -->
  <polyline class="red" points="1210,242 1210,300"/>
  <polyline class="blk" points="1240,242 1240,300"/>
  <polyline class="sig" points="1270,242 1270,300"/>
  <text x="1338" y="276" class="sm" transform="rotate(90 1338 276)">штатный 3-pin шлейф (daisy)</text>

  <!-- WAGO -> PAN power -->
  <polyline class="red" points="820,250 1000,250 1000,182 1188,182" marker-end="url(#arR)"/>
  <text x="1050" y="244" class="wlbl" fill="#d63b2f">+7.4 В → VIN</text>
  <polyline class="blk" points="820,299 950,299 950,205 1150,205" marker-end="url(#arB)"/>
  <text x="1000" y="293" class="wlbl">GND</text>

  <!-- SIGNAL node + resistor + ESP32 -->
  <rect x="470" y="600" width="240" height="170" fill="#e8f0ff" stroke="#5b86c9" stroke-width="2.5" class="box"/>
  <text x="590" y="628" class="lbl" text-anchor="middle">ESP32 (мост к сервам)</text>
  <line x1="486" y1="640" x2="694" y2="640" stroke="#c4d2ea"/>
  <text x="486" y="664" class="sm">GPIO16 (RX) → Signal (напрямую)</text>
  <text x="486" y="688" class="sm">GPIO17 (TX) → [≈1кОм] → Signal</text>
  <text x="486" y="712" class="sm">GND → общая земля (WAGO−)</text>
  <text x="486" y="736" class="sm">USB → ПК</text>

  <!-- resistor -->
  <rect x="770" y="600" width="150" height="40" fill="#fff7e6" stroke="#d8a72e" class="box"/>
  <text x="845" y="618" class="lbl" text-anchor="middle">≈ 1 кОм</text>
  <text x="845" y="634" class="sm" text-anchor="middle">5 × 220 Ом послед.</text>

  <!-- signal node -->
  <circle cx="1010" cy="640" r="6" fill="#e8820c"/>
  <text x="1010" y="672" class="sm" fill="#a8610a" text-anchor="middle">Signal-узел (белый)</text>

  <!-- TX -> resistor -> node -->
  <polyline class="sig" points="710,690 745,690 745,620 770,620"/>
  <polyline class="sig" points="920,620 1010,620 1010,634"/>
  <!-- RX -> node direct -->
  <polyline class="sig" points="710,660 960,660 960,640 1004,640"/>
  <!-- node -> servo bus signal -->
  <polyline class="sig" points="1010,634 1010,470 1300,470 1300,242" marker-end="url(#ar)"/>
  <text x="1120" y="462" class="sm" fill="#a8610a">→ Signal шины серв</text>

  <!-- common ground WAGO- -> ESP32 GND -->
  <polyline class="blk" points="700,299 720,299 720,560 590,560 590,600" marker-end="url(#arB)"/>
  <text x="612" y="556" class="wlbl">общая земля → ESP32 GND</text>

  <!-- PC -->
  <rect x="1140" y="610" width="210" height="140" fill="#ede9ff" stroke="#7b66d6" stroke-width="2.5" class="box"/>
  <text x="1245" y="640" class="lbl" text-anchor="middle">ПК (Windows)</text>
  <text x="1245" y="666" class="sm" text-anchor="middle">OpenCV + MediaPipe</text>
  <text x="1245" y="688" class="sm" text-anchor="middle">P-регулятор → углы</text>
  <text x="1245" y="710" class="sm" text-anchor="middle">→ COM-порт ESP32</text>
  <text x="1245" y="732" class="sm" text-anchor="middle">(опц.) VLM «найди X»</text>

  <!-- ESP32 USB -> PC -->
  <polyline class="usb" points="710,725 1000,725 1000,690 1138,690" marker-end="url(#ar)"/>
  <text x="850" y="719" class="wlbl" fill="#6b7280">USB (команды pan/tilt + ReadPos)</text>

  <!-- ESP32-CAM electrical -->
  <rect x="1150" y="430" width="180" height="64" fill="#e8f0ff" stroke="#5b86c9" stroke-width="2.5" class="box"/>
  <text x="1240" y="456" class="lbl" text-anchor="middle">ESP32-CAM 📷</text>
  <text x="1240" y="478" class="sm" text-anchor="middle">на payload</text>

  <rect x="940" y="430" width="170" height="50" fill="#f2f4f7" stroke="#aeb7c4" class="box"/>
  <text x="1025" y="450" class="lbl" text-anchor="middle">5 В · свой USB</text>
  <text x="1025" y="468" class="sm" text-anchor="middle">зарядка / повербанк</text>
  <polyline class="red" points="1110,448 1140,448 1140,452" marker-end="url(#arR)"/>
  <polyline class="blk" points="1110,466 1130,466 1130,472" marker-end="url(#arB)"/>

  <!-- CAM wifi -> PC -->
  <polyline class="wifi" points="1300,494 1300,560 1245,560 1245,608" marker-end="url(#ar)"/>
  <text x="1308" y="540" class="sm" fill="#1f7a47">WiFi MJPEG :81/stream</text>

  <!-- LEGEND -->
  <rect x="412" y="830" width="430" height="184" fill="#f7f9fc" stroke="#d7dde6" class="box"/>
  <text x="430" y="858" class="pnl">Легенда</text>
  <line x1="430" y1="880" x2="475" y2="880" class="red"/><text x="485" y="884" class="lbl">+ питание (12 В / 7.4 В)</text>
  <line x1="430" y1="908" x2="475" y2="908" class="blk"/><text x="485" y="912" class="lbl">GND — общая земля (обязательна!)</text>
  <line x1="430" y1="936" x2="475" y2="936" class="sig"/><text x="485" y="940" class="lbl">Signal — шина серв (полудуплекс)</text>
  <line x1="430" y1="964" x2="475" y2="964" class="usb"/><text x="485" y="968" class="lbl">USB — ESP32 ↔ ПК</text>
  <line x1="430" y1="992" x2="475" y2="992" class="wifi"/><text x="485" y="996" class="lbl">WiFi — видеопоток камеры → ПК</text>

  <!-- WARNING note -->
  <rect x="864" y="830" width="540" height="184" fill="#fff5f4" stroke="#e3a59f" class="box"/>
  <text x="884" y="858" class="pnl" fill="#b23026">⚠ Порядок включения</text>
  <text x="884" y="886" class="lbl">1. LM2596: подать только 12 В на IN, сервы НЕ подключены.</text>
  <text x="884" y="910" class="lbl">2. Мультиметром на OUT — крутить винт до 7.4 В (7.2–7.5).</text>
  <text x="884" y="934" class="lbl">3. Только теперь паять OUT → VIN/GND серв.</text>
  <text x="884" y="958" class="lbl">4. Общая земля: GND серв = OUT− = ESP32 GND = USB.</text>
  <text x="884" y="982" class="lbl">5. Сервы: pan = ID 1, tilt = ID 2, обе центр = 2048.</text>
  <text x="884" y="1006" class="sm" fill="#b23026">12 В напрямую на серву = смерть. 5 В = слабо + ребут.</text>
</svg>
