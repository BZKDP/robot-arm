<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1050" viewBox="0 0 1300 1050" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect width="1300" height="1050" fill="#f8fafc"/>

  <!-- Title -->
  <text x="650" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Механика руки — как соединяются детали</text>

  <!-- colour legend -->
  <rect x="360" y="55" width="18" height="14" fill="#475569"/><text x="384" y="67" font-size="12.5" fill="#334155">мотор + редуктор</text>
  <rect x="520" y="55" width="18" height="14" fill="#94a3b8"/><text x="544" y="67" font-size="12.5" fill="#334155">алюминий (балки, кронштейны)</text>
  <rect x="770" y="55" width="18" height="14" fill="#f59e0b"/><text x="794" y="67" font-size="12.5" fill="#334155">3D-печать (переходники, хабы) — делаешь сам</text>

  <!-- ============================================================ -->
  <!-- PANEL A -->
  <rect x="30" y="88" width="1240" height="470" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="55" y="118" font-size="17" font-weight="700" fill="#0f172a">① Как устроен ОДИН сустав (пример — локоть)</text>

  <!-- Beam A (fixed link) -->
  <rect x="90" y="300" width="300" height="40" rx="6" fill="#94a3b8" stroke="#64748b"/>
  <circle cx="140" cy="320" r="4" fill="#475569"/><circle cx="200" cy="320" r="4" fill="#475569"/><circle cx="260" cy="320" r="4" fill="#475569"/><circle cx="330" cy="320" r="4" fill="#475569"/>
  <text x="150" y="290" font-size="13" font-weight="700" fill="#334155">БАЛКА A (звено)</text>
  <text x="150" y="368" font-size="12" fill="#64748b">держит КОРПУС редуктора — неподвижна в этом суставе</text>

  <!-- U-bracket wall -->
  <rect x="392" y="250" width="22" height="140" rx="4" fill="#cbd5e1" stroke="#64748b"/>
  <text x="360" y="235" font-size="12.5" font-weight="700" fill="#334155">U-кронштейн (вилка)</text>

  <!-- adapter plate (printed) -->
  <rect x="416" y="258" width="14" height="124" rx="3" fill="#f59e0b" stroke="#b45309"/>

  <!-- gearbox + motor (axis toward viewer -> circle) -->
  <circle cx="480" cy="320" r="54" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <text x="480" y="316" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e2e8f0">CM36</text>
  <text x="480" y="333" text-anchor="middle" font-size="11" fill="#cbd5e1">+ NEMA17</text>

  <!-- hub (printed) -->
  <circle cx="480" cy="320" r="16" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>

  <!-- Beam B (rotating link) -->
  <polygon points="472,308 640,420 622,450 454,338" fill="#94a3b8" stroke="#64748b"/>
  <text x="590" y="470" font-size="13" font-weight="700" fill="#334155">БАЛКА B (звено)</text>
  <text x="560" y="490" font-size="12" fill="#64748b">крепится на ХАБ выходного вала — ВРАЩАЕТСЯ вокруг оси</text>

  <!-- rotation arrow around joint -->
  <path d="M 540 268 A 70 70 0 0 1 560 360" fill="none" stroke="#0ea5e9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- callout leaders -->
  <line x1="480" y1="266" x2="480" y2="150" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="480" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">редуктор CM36 + мотор NEMA17</text>
  <text x="480" y="128" text-anchor="middle" font-size="11.5" fill="#64748b">ось сустава направлена НА ТЕБЯ (видим круглый торец)</text>

  <line x1="423" y1="258" x2="700" y2="200" stroke="#f59e0b" stroke-dasharray="3 3"/>
  <text x="705" y="197" font-size="12.5" font-weight="700" fill="#b45309">переходник (3D-печать): круглый редуктор ↔ плоский кронштейн</text>

  <line x1="496" y1="320" x2="770" y2="300" stroke="#f59e0b" stroke-dasharray="3 3"/>
  <text x="775" y="304" font-size="12.5" font-weight="700" fill="#b45309">хаб (3D-печать): зажимает вал ↔ прикручен к балке B</text>

  <text x="775" y="345" font-size="12" fill="#334155">↻ мотор крутит вал → балка B поворачивается</text>
  <text x="775" y="367" font-size="12" fill="#64748b">На обратной стороне вилки — 2-я стенка + ПОДШИПНИК</text>
  <text x="775" y="385" font-size="12" fill="#64748b">держат вал, чтобы он не гнулся под нагрузкой.</text>

  <!-- mini exploded strip -->
  <text x="55" y="418" font-size="13" font-weight="700" fill="#334155">Порядок «что к чему крепится»:</text>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="428" width="90" height="46" rx="5" fill="#64748b"/><text x="105" y="456" fill="#fff">NEMA17</text>
    <text x="158" y="456" font-size="16" fill="#94a3b8">→</text>
    <rect x="172" y="428" width="90" height="46" rx="5" fill="#475569"/><text x="217" y="450" fill="#fff">редуктор</text><text x="217" y="465" fill="#cbd5e1">CM36</text>
    <text x="270" y="456" font-size="16" fill="#94a3b8">→</text>
    <rect x="284" y="428" width="96" height="46" rx="5" fill="#f59e0b"/><text x="332" y="450" fill="#7c2d12">переходник</text><text x="332" y="465" fill="#7c2d12">(печать)</text>
    <text x="388" y="456" font-size="16" fill="#94a3b8">→</text>
    <rect x="402" y="428" width="96" height="46" rx="5" fill="#cbd5e1"/><text x="450" y="450" fill="#334155">U-кронштейн</text><text x="450" y="465" fill="#334155">(вилка)</text>
    <text x="506" y="456" font-size="15" fill="#94a3b8">··вал··›</text>
    <rect x="556" y="428" width="80" height="46" rx="5" fill="#f59e0b"/><text x="596" y="450" fill="#7c2d12">хаб</text><text x="596" y="465" fill="#7c2d12">(печать)</text>
    <text x="642" y="456" font-size="16" fill="#94a3b8">→</text>
    <rect x="656" y="428" width="90" height="46" rx="5" fill="#94a3b8"/><text x="701" y="450" fill="#334155">БАЛКА B</text><text x="701" y="465" fill="#334155">(звено)</text>
  </g>
  <text x="820" y="452" font-size="12" fill="#64748b">AS5600 сидит на конце выходного вала и читает угол этого сустава.</text>

  <!-- ============================================================ -->
  <!-- PANEL B -->
  <rect x="30" y="575" width="1240" height="455" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="55" y="605" font-size="17" font-weight="700" fill="#0f172a">② Как из суставов складывается вся рука (вид сбоку)</text>

  <!-- platform -->
  <rect x="120" y="965" width="240" height="34" rx="5" fill="#334155"/>
  <text x="240" y="988" text-anchor="middle" font-size="12" fill="#e2e8f0">платформа / шасси (позже)</text>

  <!-- links (draw thick bars first) -->
  <line x1="240" y1="930" x2="240" y2="880" stroke="#94a3b8" stroke-width="20" stroke-linecap="round"/>
  <line x1="240" y1="865" x2="440" y2="720" stroke="#94a3b8" stroke-width="22" stroke-linecap="round"/>
  <line x1="440" y1="720" x2="670" y2="748" stroke="#94a3b8" stroke-width="22" stroke-linecap="round"/>
  <line x1="670" y1="748" x2="760" y2="748" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>

  <!-- joints -->
  <circle cx="240" cy="930" r="26" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/><text x="240" y="935" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">J1</text>
  <circle cx="240" cy="865" r="26" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/><text x="240" y="870" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">J2</text>
  <circle cx="440" cy="720" r="26" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/><text x="440" y="725" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">J3</text>
  <circle cx="670" cy="748" r="22" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/><text x="670" y="753" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">J4</text>
  <circle cx="720" cy="748" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><text x="720" y="752" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">J5</text>

  <!-- gripper -->
  <path d="M 758 738 L 792 726 M 758 748 L 792 748 M 758 758 L 792 770" stroke="#334155" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="798" y="752" font-size="12" font-weight="700" fill="#334155">захват</text>

  <!-- rotation arrows -->
  <path d="M 214 930 A 30 30 0 0 1 266 916" fill="none" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 214 850 A 34 34 0 0 1 262 845" fill="none" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 414 705 A 34 34 0 0 1 462 705" fill="none" stroke="#0ea5e9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- beam labels -->
  <text x="300" y="800" font-size="12.5" font-weight="700" fill="#334155" transform="rotate(-36 300 800)">БАЛКА 184мм (плечо)</text>
  <text x="520" y="760" font-size="12.5" font-weight="700" fill="#334155">БАЛКА 184мм (предплечье)</text>

  <!-- right-side legend list -->
  <rect x="880" y="640" width="380" height="330" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="900" y="670" font-size="14" font-weight="700" fill="#0f172a">Суставы (снизу вверх)</text>
  <text x="900" y="702" font-size="13" fill="#334155"><tspan font-weight="700" fill="#2563eb">J1 база</tspan> — поворот всей руки (ось ↑)</text>
  <text x="900" y="730" font-size="13" fill="#334155"><tspan font-weight="700" fill="#2563eb">J2 плечо</tspan> — подъём/опускание</text>
  <text x="900" y="758" font-size="13" fill="#334155"><tspan font-weight="700" fill="#2563eb">J3 локоть</tspan> — сгиб</text>
  <text x="900" y="786" font-size="13" fill="#334155"><tspan font-weight="700" fill="#2563eb">J4 запястье</tspan> — наклон кисти</text>
  <text x="900" y="814" font-size="13" fill="#334155"><tspan font-weight="700" fill="#2563eb">J5 запястье</tspan> — поворот кисти</text>
  <text x="900" y="842" font-size="13" fill="#334155"><tspan font-weight="700" fill="#334155">+ захват</tspan> — берёт предмет</text>
  <line x1="900" y1="858" x2="1240" y2="858" stroke="#cbd5e1"/>
  <text x="900" y="884" font-size="12.5" fill="#475569">Каждый сустав = редуктор CM36 + мотор</text>
  <text x="900" y="904" font-size="12.5" fill="#475569">NEMA17 + энкодер AS5600.</text>
  <text x="900" y="932" font-size="12.5" fill="#475569">Между суставами = алюминиевые балки.</text>
  <text x="900" y="954" font-size="12.5" fill="#b45309">Стыки редуктор↔алюминий = печатные переходники.</text>
</svg>
