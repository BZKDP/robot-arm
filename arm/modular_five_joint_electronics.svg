<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .card { fill: #ffffff; stroke: #cfd8e3; stroke-width: 2; rx: 10; }
      .box { fill: #f9fafb; stroke: #9aa8b6; stroke-width: 2; rx: 8; }
      .module { fill: #eef6ff; stroke: #2b6cb0; stroke-width: 2.5; rx: 10; }
      .tmc { fill: #1f2937; stroke: #111827; stroke-width: 2; rx: 6; }
      .motor { fill: #111827; stroke: #0b1220; stroke-width: 2; rx: 6; }
      .sensor { fill: #0f5132; stroke: #063b24; stroke-width: 2; rx: 5; }
      .gear { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; }
      .hub { fill: #16a34a; stroke: #15803d; stroke-width: 2; }
      .mag { fill: #ef4444; stroke: #991b1b; stroke-width: 2; }
      .txt { font-family: Arial, sans-serif; fill: #111827; font-size: 18px; }
      .small { font-family: Arial, sans-serif; fill: #374151; font-size: 14px; }
      .tiny { font-family: Arial, sans-serif; fill: #4b5563; font-size: 12px; }
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .h { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .pin { font-family: Consolas, monospace; font-size: 14px; fill: #111827; }
      .red { stroke: #dc2626; stroke-width: 5; fill: none; }
      .black { stroke: #111827; stroke-width: 5; fill: none; }
      .orange { stroke: #f59e0b; stroke-width: 3; fill: none; }
      .green { stroke: #16a34a; stroke-width: 3; fill: none; }
      .blue { stroke: #2563eb; stroke-width: 3; fill: none; }
      .violet { stroke: #7c3aed; stroke-width: 3; fill: none; }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <marker id="arrowSig" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="980"/>
  <text class="title" x="40" y="54">Электроника для 5 одинаковых локтей-модулей</text>
  <text class="small" x="40" y="82">Вариант: TMC2209 находится внутри каждого локтя. Локоть подключается как готовый сервопривод одним разъемом.</text>

  <rect class="card" x="35" y="115" width="410" height="300"/>
  <text class="h" x="60" y="150">Питание моторов</text>
  <rect class="box" x="65" y="175" width="140" height="70"/>
  <text class="txt" x="86" y="205">БП 24 В</text>
  <text class="small" x="86" y="228">10 А лучше</text>
  <rect class="box" x="245" y="175" width="150" height="70"/>
  <text class="txt" x="272" y="205">предохран.</text>
  <text class="small" x="280" y="228">в плюсе</text>
  <rect class="box" x="245" y="275" width="150" height="70"/>
  <text class="txt" x="286" y="305">E-STOP</text>
  <text class="small" x="273" y="328">рубить VM+</text>
  <path class="red" marker-end="url(#arrowRed)" d="M205 200 H245"/>
  <path class="red" marker-end="url(#arrowRed)" d="M320 245 V275"/>
  <path class="red" marker-end="url(#arrowRed)" d="M395 310 H520"/>
  <path class="black" marker-end="url(#arrowBlack)" d="M135 245 V380 H520"/>
  <text class="tiny" x="60" y="390">Твой 12 В 3 А: только стенд на один мотор.</text>

  <rect class="card" x="470" y="115" width="360" height="300"/>
  <text class="h" x="495" y="150">Центральная плата</text>
  <rect class="box" x="500" y="175" width="130" height="100"/>
  <text class="txt" x="535" y="210">ESP32</text>
  <text class="small" x="515" y="237">STEP/DIR/EN</text>
  <text class="small" x="523" y="258">USB к ПК</text>
  <rect class="box" x="675" y="175" width="125" height="100"/>
  <text class="txt" x="698" y="210">TCA9548A</text>
  <text class="small" x="696" y="237">I2C x8</text>
  <text class="small" x="696" y="258">для AS5600</text>
  <path class="blue" marker-end="url(#arrowSig)" d="M630 220 H675"/>
  <text class="tiny" x="636" y="212">SDA/SCL</text>
  <rect class="box" x="500" y="315" width="300" height="70"/>
  <text class="txt" x="528" y="344">DC-DC 24/12 В -> 5 В</text>
  <text class="small" x="555" y="367">если ESP32 не от USB</text>
  <path class="red" d="M520 310 V385"/>
  <path class="black" d="M555 310 V385"/>

  <path class="red" d="M520 310 H1360"/>
  <text class="pin" x="845" y="302">VM+ силовая шина</text>
  <path class="black" d="M520 380 H1360"/>
  <text class="pin" x="845" y="372">GND общая шина</text>

  <g id="module1" transform="translate(900,130)">
    <rect class="module" x="0" y="0" width="420" height="135"/>
    <text class="h" x="18" y="30">J1 локоть 1</text>
    <rect class="tmc" x="20" y="50" width="72" height="58"/>
    <text class="small" x="29" y="84" fill="#fff">TMC</text>
    <rect class="motor" x="120" y="45" width="60" height="66"/>
    <text class="tiny" x="125" y="83" fill="#fff">NEMA</text>
    <circle class="gear" cx="220" cy="78" r="34"/>
    <text class="tiny" x="202" y="84" fill="#fff">CM36</text>
    <circle class="hub" cx="290" cy="78" r="28"/>
    <circle class="mag" cx="290" cy="34" r="10"/>
    <rect class="sensor" x="335" y="20" width="55" height="28"/>
    <text class="tiny" x="340" y="40" fill="#fff">AS5600</text>
    <text class="tiny" x="108" y="123">470uF между VM+ и GND внутри модуля</text>
  </g>
  <g transform="translate(900,290)">
    <rect class="module" x="0" y="0" width="420" height="95"/>
    <text class="h" x="18" y="35">J2 локоть 2</text>
    <text class="small" x="18" y="64">точно такой же модуль, другой порт на плате</text>
  </g>
  <g transform="translate(900,410)">
    <rect class="module" x="0" y="0" width="420" height="95"/>
    <text class="h" x="18" y="35">J3 локоть 3</text>
    <text class="small" x="18" y="64">номер задает разъем J3, не сам мотор</text>
  </g>
  <g transform="translate(900,530)">
    <rect class="module" x="0" y="0" width="420" height="95"/>
    <text class="h" x="18" y="35">J4 локоть 4</text>
    <text class="small" x="18" y="64">та же распиновка, та же прошивка по оси</text>
  </g>
  <g transform="translate(900,650)">
    <rect class="module" x="0" y="0" width="420" height="95"/>
    <text class="h" x="18" y="35">J5 локоть 5</text>
    <text class="small" x="18" y="64">можно отключить последний и работать с 4</text>
  </g>

  <path class="red" d="M900 170 H860 V310 H830"/>
  <path class="black" d="M900 205 H850 V380 H830"/>
  <path class="orange dash" marker-end="url(#arrowSig)" d="M630 180 C760 145 800 145 900 160"/>
  <path class="green dash" marker-end="url(#arrowSig)" d="M630 195 C760 230 800 238 900 240"/>
  <path class="blue dash" marker-end="url(#arrowSig)" d="M800 220 C850 210 865 205 900 195"/>

  <path class="red" d="M900 320 H850 V310"/>
  <path class="black" d="M900 355 H850 V380"/>
  <path class="orange dash" d="M630 185 C760 305 820 330 900 330"/>
  <path class="blue dash" d="M800 225 C850 285 865 305 900 345"/>

  <path class="red" d="M900 440 H850 V310"/>
  <path class="black" d="M900 475 H850 V380"/>
  <path class="orange dash" d="M630 190 C755 435 815 450 900 450"/>
  <path class="blue dash" d="M800 230 C850 405 870 435 900 465"/>

  <path class="red" d="M900 560 H850 V310"/>
  <path class="black" d="M900 595 H850 V380"/>
  <path class="orange dash" d="M630 195 C750 565 815 570 900 570"/>
  <path class="blue dash" d="M800 235 C845 525 870 555 900 585"/>

  <path class="red" d="M900 680 H850 V310"/>
  <path class="black" d="M900 715 H850 V380"/>
  <path class="orange dash" d="M630 200 C745 695 810 690 900 690"/>
  <path class="blue dash" d="M800 240 C840 650 870 675 900 705"/>

  <rect class="card" x="35" y="455" width="785" height="220"/>
  <text class="h" x="60" y="492">Разъем каждого локтя, вариант на 8 контактов</text>
  <text class="pin" x="70" y="532">1 VM+</text><text class="small" x="170" y="532">12/24 В на TMC2209 внутри локтя</text>
  <text class="pin" x="70" y="560">2 GND</text><text class="small" x="170" y="560">общая земля всех плат</text>
  <text class="pin" x="70" y="588">3 3V3</text><text class="small" x="170" y="588">VIO TMC2209 + VCC AS5600</text>
  <text class="pin" x="70" y="616">4 STEP</text><text class="small" x="170" y="616">отдельный STEP от ESP32</text>
  <text class="pin" x="410" y="532">5 DIR</text><text class="small" x="510" y="532">отдельный DIR от ESP32</text>
  <text class="pin" x="410" y="560">6 EN</text><text class="small" x="510" y="560">лучше вести на ESP32; временно можно на GND</text>
  <text class="pin" x="410" y="588">7 SDA</text><text class="small" x="510" y="588">свой канал TCA9548A</text>
  <text class="pin" x="410" y="616">8 SCL</text><text class="small" x="510" y="616">свой канал TCA9548A</text>
  <text class="tiny" x="60" y="648">Если берешь один круглый разъем: 8 контактов, ток не меньше 3 А на силовые контакты.</text>
  <text class="tiny" x="60" y="668">Если сомневаешься: XT30 отдельно для VM/GND, JST-XH отдельно для сигналов.</text>

  <rect class="card" x="35" y="710" width="785" height="195"/>
  <text class="h" x="60" y="747">Идея механической модульности</text>
  <text class="small" x="60" y="780">Каждый локоть одинаковый: входная щека, мотор+редуктор, выходной хаб, AS5600 напротив магнита, выходная щека под следующий локоть.</text>
  <text class="small" x="60" y="812">Снимаешь последний локоть: просто отключил J5 и открутил стык. Снимаешь средний: физически соединяешь соседние щеки, в программе отключаешь/переназначаешь ось.</text>
  <text class="small" x="60" y="844">Для настоящего самоопределения локтя нужен локальный MCU/DIP ID/CAN/RS485. Сейчас проще и надежнее: номер задает порт J1-J5.</text>
  <text class="small" x="60" y="876">AS5600 всегда ставится после редуктора: магнит на выходном хабе, плата неподвижна на корпусе, зазор примерно 1-2 мм.</text>
</svg>
