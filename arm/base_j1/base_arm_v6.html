<script>
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a1d23);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,6000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.55));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(250,450,300);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xa0b0ff,.3);dl2.position.set(-300,200,-250);scene.add(dl2);
scene.add(new THREE.GridHelper(900,30,0x39404d,0x262b33));

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.35});
const mat={sup:M(0x8a8a8a),plate:M(0xb7bcc4),motor:M(0x2f2f2f),gb:M(0x2b4a9b),face:M(0x9aa4ad),
 car:M(0xc9c9c9),shaft:M(0xe6e6e6),alu:M(0xc8ccd2),tube:M(0xb4bac2),buy:M(0x7f8790),
 mag:M(0xc02626),pcb:M(0x1b7f3b),stand:M(0xc9a227),screw:M(0x22252b),printed:M(0xe0912b),
 conn:M(0xf0f0e8),n14:M(0x3d4450),hole:new THREE.MeshBasicMaterial({color:0x2e333b,side:THREE.DoubleSide})};

const BOM={
 sup:{n:'Опора базы — ТВОЁ',d:'высота ~55мм; пластина-сэндвич крепится к ней',s:'🔧 сам'},
 plate:{n:'Пластина-сэндвич (с редуктором)',d:'~56×56×3, зажата между мотором и редуктором J1',s:'✅'},
 motor:{n:'Мотор NEMA17 17HS4401',d:'42×42×47мм. ЕСТЬ 5 шт = на все суставы. ВНИМАНИЕ: NEMA23 к редуктору CM36 НЕ подходит (фланец 57≠42, вал 6.35≠5)! Усиление = длинный NEMA17 (17HS8401, 0.52Нм) на те же редукторы, или NEMA23+свой 23-планетарник',s:'✅ ×5'},
 gb:{n:'Планетарный редуктор 1:71 CM36',d:'Ø36×35; крутится ТОЛЬКО вал Ø8 (лыски 5.9); лимит ~10-15 Нм',s:'✅ ×5'},
 coupP:{n:'Муфта ПЕЧАТНАЯ (PETG) — времянка',d:'STL: arm/printed/flange_coupling_8mm_PETG.stl. Фланец 26×42×5, 4×М4 (±8,±16)=сетка 8мм. Держит ~8Нм (запас 3×)',s:'🖨 2-4шт'},
 coupM:{n:'Муфта фланцевая МЕТАЛЛ 8мм',d:'едет 4шт. ⚠️ хаб Ø16 НЕ проходит отв. 14мм → металл-вариант потребует рассверлить стенку 14→16.5 (ступенчатое сверло) — опция НА ПОТОМ, стартуем на печатных без сверления',s:'🚚 едут'},
 chan:{n:'U-скоба 3111-0004-0001 — БЕЗ СВЕРЛЕНИЯ!',d:'48×48×96, зазор 43, сетка 8мм Ø4.2, большие отв. Ø14 (замер). Ступица Ø19 НЕ проходит в 14 → ПРОСТАВКА 5мм снаружи + носик муфты сквозь 14мм изнутри. Болт М8 проходит 14мм свободно. ВСЁ крепление — в существующие отверстия',s:'✅ целая!'},
 spacer:{n:'Проставка редуктора 5мм (печать) — ключ zero-drill',d:'STL: gearbox_spacer_5mm_PETG.stl. Диск Ø52×5: карман Ø20.4 под ступицу, 4×М3 ПОТАЙ (круг 27) в резьбы торца редуктора — заподлицо, 4×М4 крест 32мм в СЕТКУ скобы + гайки изнутри',s:'🖨 по 1 на сустав'},
 tube:{n:'Профиль квадратный алюм. 20×20×1.5 (звено)',d:'куски ~150мм. Крепления: низ — 4×М4 к фланцу муфты; ось — болт М8 насквозь; верх — торцом под ДНО следующей вилки: 2×М4 сверху сквозь ШТАТНЫЕ отверстия дна в закладные гайки печатной ПРОБКИ в торце трубы. Сверлить трубу: 4×Ø4.5 (низ) + 2×Ø8.2 (ось) — и всё',s:'✅ куплена'},
 corner:{n:'Уголок стальной 20×20 — стык трубы с вилкой',d:'по 2 на стык: одна полка к грани трубы (М4 насквозь трубы + гайка), вторая — ВНУТРЬ над торцом, под дно вилки (М4 сквозь ШТАТНОЕ отверстие дна, гайка снизу — доступ пальцами сбоку через открытую пасть). Уголки на СОСЕДНИХ гранях трубы, чтобы полки не пересекались',s:'🛒 «уголок мебельный 20х20» ×4-6'},
 beam:{n:'Балка 184мм — вспомогательная роль',d:'накладки на стыки, распорки, кронштейны. Несущие звенья = труба/скобы',s:'✅ ×6'},
 kfl:{n:'KFL08 — опора дальней стороны КАЖДОГО локтя',d:'бор 8мм, 2×М4 (межцентровое 37). Нужно по 1 на сустав J2/J3/J4',s:'🛒 ×3-4 по 203₽'},
 rod:{n:'Стаб-ось = болт М8×45 СКВОЗЬ трубу',d:'болт через оба Ø8.2 отв. в трубе на оси сустава, гайка внутри трубы, хвост в KFL08 (затянут 2 гайками к обойме). Металл-металл, печатный мост НЕ нужен. Магнит на торец',s:'🛒 хозмаг, по 1 на сустав'},
 pcb:{n:'AS5600 на J2/J3/J4 (полный контроль)',d:'плата 20×20 на стойках на стенке Б, магнит Ø6×2.5 на торце стаб-оси',s:'✅ ×5'},
 hallj1:{n:'J1: индекс SS49E + магнит 3×2',d:'холл на кронштейне к неподвижной ступице/торцу, магнит в дне скобы; + счёт шагов + автокалибровка',s:'🛒'},
 n14:{n:'NEMA14 14HK0406 — на J5/кисть (потом)',d:'~0.1-0.14 Нм без редуктора: подъём НЕ потянет, но поворот кисти вокруг оси и гриппер — отлично',s:'✅ приехали'},
 scr:{n:'Крепёж М3/М4 + фиксатор резьбы',d:'М3×10 (редуктор-стенка ×4 на сустав), М3×16 (хомут печ. муфты), М4×10/12 + нейлок (весь каркас)',s:'🛒 наборы'},
 conn:{n:'Разъёмы моторов JST',d:'кабели до TMC2209 у базы',s:'✅'},
 wire:{n:'Проводка (чёрные жгуты в модели)',d:'с каждого сустава: 4 жилы мотор + 4 AS5600. Магистраль — ВНУТРИ полой трубы (готовый кабель-канал!), у каждой оси сервисная петля 60-80мм на изгиб, крепление стяжками в отверстия сетки, всё сходит вниз к ESP32+драйверам у базы; у суставов разъёмы для разборки',s:'✅ + стяжки'},
 calc:{n:'📐 РАСЧЁТЫ И ФИНАЛЬНОЕ ЗАКЛЮЧЕНИЕ',d:'МОМЕНТЫ (лимит редуктора 10-15Нм): J4=0.5Нм (20×) · J3=2.3Нм (5×) · J2=6.3Нм пик (1.6-2.4×, усиление = длинный NEMA17 17HS8401) · J1 кручение свободно.<br>ЗАЗОРЫ ВРАЩЕНИЯ: хаб Ø20 vs головки М3 редуктора = 0.75мм ✅ (потайные винты → 3мм) · углы трубы vs стенка Б = 0.2-0.9мм ⚠️ → ОБЯЗАТЕЛЬНО: фаска 2×45° напильником на 2 дальних углах трубы в зоне ±30мм от оси → зазор 1.5мм ✅ · гайки фланца вращаются в свободной зоне ✅ · магнит-плата AS5600 зазор 2-3мм ✅.<br>ТОЧНОСТЬ: повторяемость записанных поз ±0.3-0.5мм при однонаправленном подходе (софт), настроенном токе и жёсткой затяжке с фиксатором.<br>СВЕРЛОВКА: СКОБЫ — НОЛЬ ОТВЕРСТИЙ (проставка+носик+существующие 14мм)! Только ТРУБА: 4×Ø4.5 (низ) + 2×Ø8.2 (ось) — расходник из Леруа.<br>Носик муфты Ø13.6 в отверстии 14мм = доп. опора скольжения (капля силиконовой смазки).<br>ВЕРДИКТ: собирается и крутится БЕЗ сверления скоб; доработки: фаски углов трубы + потай М3 уже в проставке',s:'✅ проверено'}};
const allG=[];
function G(key){const g=new THREE.Group();g.userData.bom=key;allG.push(g);return g;}
function box(w,h,d,m,x,y,z,g){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);g.add(o);return o}
function cylY(dia,h,m,x,y,z,g){const o=new THREE.Mesh(new THREE.CylinderGeometry(dia/2,dia/2,h,32),m);o.position.set(x,y,z);g.add(o);return o}
function cylZ(dia,h,m,x,y,z,g){const o=cylY(dia,h,m,0,0,0,g);o.rotation.x=Math.PI/2;o.position.set(x,y,z);return o}
function cylX(dia,h,m,x,y,z,g){const o=cylY(dia,h,m,0,0,0,g);o.rotation.z=Math.PI/2;o.position.set(x,y,z);return o}
function holeZ(r,x,y,z,g){const o=new THREE.Mesh(new THREE.CircleGeometry(r,16),mat.hole);o.position.set(x,y,z);g.add(o);return o}
function holeY(r,x,y,z,g){const o=new THREE.Mesh(new THREE.CircleGeometry(r,16),mat.hole);o.rotation.x=-Math.PI/2;o.position.set(x,y,z);g.add(o);return o}
function hexZ(af,h,m,x,y,z,g){const o=new THREE.Mesh(new THREE.CylinderGeometry(af/1.732,af/1.732,h,6),m);o.rotation.x=Math.PI/2;o.position.set(x,y,z);g.add(o);return o}
const wmat=new THREE.MeshStandardMaterial({color:0x111318,roughness:.9});
function wire(g,pts,r){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])));
 const o=new THREE.Mesh(new THREE.TubeGeometry(c,24,r||1.7,6),wmat);o.userData.bom='wire';g.add(o);return o}

// ============ повторно используемые сборки ============
function mgbZ(g){ // мотор+редуктор, торец=локальный z0, тело в -z
  box(42.3,42.3,47,mat.motor,0,0,-58.5,g);
  cylZ(36,35,mat.gb,0,0,-17.5,g); cylZ(36,1.2,mat.face,0,0,0.6,g);
  cylZ(19,4,mat.car,0,0,3,g); cylZ(8,11,mat.shaft,0,0,10.5,g); cylZ(5,5,M(0x555b66),0,0,18.5,g);
  box(14,6,8,mat.conn,0,-24,-66,g);
}
function couplingPair(g,plateT){ // обе версии муфты + СВОЙ крепёж; plateT=толщина прикручиваемого (труба 20 / дно 2.5)
  const p=G('coupP'); g.add(p);                                  // ПЕЧАТНАЯ: компакт-хомут Ø20
  cylZ(20,15,mat.printed,0,0,12.5,p);
  cylZ(13.6,3.3,mat.printed,0,0,3.4,p);                          // НОСИК в отверстие 14мм стенки
  box(6.5,1.7,15,M(0x14161b),6.6,0,12.5,p);                      // пропил от бора наружу
  cylY(3,20,mat.screw,6.4,0,8.5,p); cylY(3,20,mat.screw,6.4,0,15.5,p); // 2xМ3 внутри Ø20
  box(26,42,5,mat.printed,0,0,22.5,p);                           // фланец 26x42
  for(const q of [[8,16],[8,-16],[-8,16],[-8,-16]]){              // крепёж ПЕЧАТНОЙ: 4xМ4 (сетка 8мм)
    hexZ(8.5,3.2,mat.screw,q[0],q[1],18.3,p);                     // гайка под фланцем
    const bl=25+plateT+1.5-16;                                     // болт: z 16 .. сквозь трубу/дно
    cylZ(4,bl,mat.screw,q[0],q[1],16+bl/2,p);
    cylZ(8,2.6,mat.screw,q[0],q[1],25+plateT+1.4,p); }             // ГОЛОВКА на внешней грани
  const m=G('coupM'); g.add(m);                                   // МЕТАЛЛ (едет)
  cylZ(16,12,mat.buy,0,0,14,m); cylZ(30,3,mat.buy,0,0,21.5,m);
  for(let a=0;a<360;a+=60) holeZ(1.8,12*Math.cos(a*Math.PI/180),12*Math.sin(a*Math.PI/180),23.2,m);
  for(const q of [[6,10.4],[6,-10.4],[-6,10.4],[-6,-10.4]]){      // крепёж МЕТАЛЛ: 4xМ3 из 6 отв. BC24
    hexZ(7,2.6,mat.screw,q[0],q[1],19.8,m);
    const bl=24.5+plateT+1.5-15;
    cylZ(3,bl,mat.screw,q[0],q[1],15+bl/2,m);
    cylZ(6.5,2.4,mat.screw,q[0],q[1],24.5+plateT+1.3,m); }
  return {p,m};
}
const couplers=[];
// вилка: 2 стенки (сетка+ось Ø20.5) вдоль +Y от дна; done в plane y=0
function ovalZ(x,y,z,ang,g){ // овал 9x4.5 (как на скобах), повёрнут к центру большого отв.
  const o=new THREE.Mesh(new THREE.CircleGeometry(2.25,14),mat.hole);
  o.scale.set(2,1,1); o.rotation.z=ang; o.position.set(x,y,z); g.add(o); return o;
}
const BIGS=[24,48,72]; // 3 больших отверстия стенки, шаг 24 (по фото/замерам)
function fork(g,axY){ // дно внизу; стенки с 3 БОЛЬШИМИ Ø14 + овалы вокруг + сетка ПО УЗЛАМ
  const f=G('chan'); g.add(f);
  box(48,2.5,43,mat.alu,0,1.25,0,f);                        // дно
  for(const yo of [2.56,-0.06]){
    for(let x=-16;x<=16;x+=8) for(let z=-16;z<=16;z+=8)
      if(!(x===0&&z===0)) holeY(2.1,x,yo,z,f);
    holeY(7,0,yo,0,f);
    for(const q of [[11,11],[-11,11],[11,-11],[-11,-11]]) holeY(3.2,q[0],yo,q[1],f);
  }
  for(const s of [-1,1]){
    box(48,96,2.5,mat.alu,0,48,s*22.75,f);
    for(const zo of [s*24.06, s*21.44]){
      for(const by of BIGS){
        holeZ(7,0,by,zo,f);                                  // большое Ø14
        for(const d of [[1,1],[-1,1],[1,-1],[-1,-1]])        // 4 овала по диагоналям
          ovalZ(d[0]*8.6,by+d[1]*8.6,zo,Math.atan2(d[1],d[0]),f);
      }
      for(let x=-16;x<=16;x+=8) for(let y=8;y<=88;y+=8){     // сетка ПО УЗЛАМ (0,±8,±16)
        let skip=false;
        for(const by of BIGS){ if(Math.abs(x)<4&&Math.abs(y-by)<4) skip=true;          // сам большой
          if(Math.abs(Math.abs(x)-8)<2&&Math.abs(Math.abs(y-by)-8)<3) skip=true; }     // место овала
        if(!skip) holeZ(2.1,x,y,zo,f);
      }
    }
  }
  return f;
}
function tubeCorners(g){ // 2 СТАЛЬНЫХ УГОЛКА: грань трубы <-> дно вилки, всё в штатные отверстия
  const c=G('corner'); g.add(c);
  // уголок A: на дальней грани трубы (z=19), полка внутрь над торцом
  box(16,16,2,mat.buy,0,121,20,c);       box(16,2,17,mat.buy,0,130,11.5,c);
  cylZ(4,26,mat.screw,0,121,8.5,c);      cylZ(7,2.2,mat.screw,0,121,22.2,c);   // М4 сквозь трубу
  cylY(4,9,mat.screw,0,131,8,c);         cylY(7,2.2,mat.screw,0,135,8,c);      // М4 сквозь дно (сетка 0,8)
  // уголок B: на боковой грани трубы (x=10), полка внутрь
  box(2,16,16,mat.buy,11,121,1,c);       box(17,2,16,mat.buy,3.5,130,1,c);
  cylX(4,26,mat.screw,0.5,121,1,c);      cylX(7,2.2,mat.screw,13.2,121,1,c);   // М4 сквозь трубу
  cylY(4,9,mat.screw,0,131,-6,c);        cylY(7,2.2,mat.screw,0,135,-6,c);     // М4 сквозь дно (сетка 0,-8)
}
// полный узел сустава на вилке: мотор снаружи -z, муфта внутрь, KFL08 на +z, AS5600
// возвращает pivot-группу (вращается), внутри неё труба-звено вдоль +Y
function jointModule(parent, axY){
  const drive=G('gb'); parent.add(drive);
  drive.position.set(0,axY,-29);                              // редуктор за ПРОСТАВКОЙ (zero-drill!)
  mgbZ(drive);
  const sp=G('spacer'); parent.add(sp);                       // печатная проставка 5мм
  cylZ(52,5,mat.printed,0,axY,-26.5,sp);
  const scrD=G('scr'); parent.add(scrD);                      // 4xМ4 крест 32 в СУЩЕСТВУЮЩУЮ сетку
  for(const a of [0,90,180,270]){
    const x=16*Math.cos(a*Math.PI/180), y=axY+16*Math.sin(a*Math.PI/180);
    cylZ(4,12,mat.screw,x,y,-25,scrD); hexZ(8,3,mat.screw,x,y,-19.8,scrD); }
  const kfl=G('kfl'); parent.add(kfl);
  box(37,18,11,mat.buy,0,axY,29.5,kfl);
  cylZ(18,11,mat.buy,-18.5,axY,29.5,kfl); cylZ(18,11,mat.buy,18.5,axY,29.5,kfl);
  cylZ(16,13,mat.buy,0,axY,29.5,kfl);
  const pcb=G('pcb'); parent.add(pcb);
  box(20,20,1.6,mat.pcb,0,axY,43,pcb); box(4,4,1.2,M(0x111),0,axY,41.9,pcb);
  cylZ(5,7,mat.stand,-8,axY+8,38.5,pcb); cylZ(5,7,mat.stand,8,axY-8,38.5,pcb);
  const pv=new THREE.Group(); pv.position.set(0,axY,0); parent.add(pv);
  const cp=couplingPair(pv,20); couplers.push(cp);              // 20 = труба
  cp.p.position.set(0,0,-26.2); cp.m.position.set(0,0,-26.2); // хаб -21..-6, фланец -6..-1
  const tube=G('tube'); pv.add(tube);
  box(20,150,20,mat.tube,0,55,9,tube);                        // z -1..19, y -20..130
  for(let y=-12;y<=124;y+=8) holeZ(2.2,0,y,19.2,tube);
  box(17,0.3,17,mat.hole,0,130.05,9,tube);                    // труба ПОЛАЯ: открытые торцы
  box(17,0.3,17,mat.hole,0,-20.05,9,tube);
  wire(pv,[[0,-14,9],[0,60,9],[0,122,9],[0,132,13],[2,140,-8],[3,150,-40]]); // жгут ВНУТРИ трубы -> к след. мотору
  const rod=G('rod'); pv.add(rod);                             // болт М8 СКВОЗЬ трубу -> KFL08
  cylZ(8,40,mat.shaft,0,0,17,rod);                             // z -3..37
  cylZ(13,4,mat.screw,0,0,-4.5,rod);                           // головка у фланца
  const mg=G('magj2q'); mg.userData.bom='pcb'; pv.add(mg);
  cylZ(6,2.5,mat.mag,0,0,38.4,mg);                             // магнит на торце болта
  wire(parent,[[0,axY-2,-100],[6,axY-28,-80],[10,20,-40],[4,6,-14],[0,-8,0]],1.7);  // кабель мотора вниз
  wire(parent,[[0,axY-10,44],[10,axY-40,34],[12,16,20],[4,4,10],[0,-8,4]],1.2);     // кабель AS5600 вниз
  return {pivot:pv};
}

// ============ СТАТИКА + J1 ============
const gSup=G('sup'); scene.add(gSup);
box(20,55,50,mat.sup,-35,27.5,0,gSup); box(20,55,50,mat.sup,35,27.5,0,gSup);
const gPlate=G('plate'); scene.add(gPlate); box(56,3,56,mat.plate,0,56.5,0,gPlate);
const gM1=G('motor'); scene.add(gM1); box(42.3,47,42.3,mat.motor,0,34.5,0,gM1);
box(14,8,6,mat.conn,0,18,23,G('conn')); scene.add(allG[allG.length-1]);
const gGb1=G('gb'); scene.add(gGb1);
cylY(36,35,mat.gb,0,75.5,0,gGb1); cylY(36,1.2,mat.face,0,93.6,0,gGb1);
cylY(19,4,mat.car,0,95,0,gGb1); cylY(8,11,mat.shaft,0,102.5,0,gGb1); cylY(5,5,M(0x555b66),0,110.5,0,gGb1);
const gHall=G('hallj1'); scene.add(gHall);
box(6,12,1.5,mat.buy,14,100.2,0,gHall); box(4,1.6,3,mat.pcb,14,106.9,0,gHall);

// J1 муфта (пара) вертикально: хаб на валу 97.2..112.2, фланец 112.2..117.2
const j1c=new THREE.Group(); scene.add(j1c);
const cp1=couplingPair(j1c,2.5); couplers.push(cp1);           // 2.5 = дно скобы
cp1.p.rotation.x=-Math.PI/2; cp1.p.position.set(0,92.2,0);   // z-ось -> +Y; хаб y97.2..112.2
cp1.m.rotation.x=-Math.PI/2; cp1.m.position.set(0,92.2,0);
const WEB1=117.5, AXH=72;             // ось J2 = ВЕРХНЕЕ штатное большое отверстие (72 от дна)

// ============ ВРАЩАЮЩАЯСЯ ЧАСТЬ ============
const g1=new THREE.Group(); scene.add(g1);
const gMagJ1=G('hallj1'); g1.add(gMagJ1); cylY(3,2,mat.mag,14,WEB1-1,0,gMagJ1);
const scb=new THREE.Group(); scb.position.set(0,WEB1,0); scb.rotation.set(0,0,0); g1.add(scb);
fork(scb,AXH);                                                // скоба-1 (вилка J2)
// (болты дна скобы теперь внутри пары муфт j1c - переключаются вместе с версией)

const J2=jointModule(scb,AXH);              // узел J2 в скобе-1
// общий жгут: вниз по скобе-1 + СЕРВИСНАЯ ПЕТЛЯ вокруг J1 к базе
wire(g1,[[0,WEB1+6,-22],[18,WEB1-2,-14],[34,108,0],[42,90,14],[40,72,26]],2.2);
wire(scene,[[40,72,26],[52,62,30],[62,56,20],[68,52,6]],2.2);   // хвост на неподвижной базе
// внутри J2.pivot: труба до y=130; скоба-2 дном на 100
// вилка-2 ДНОМ ВНИЗ на торце трубы (пасть вверх — след. звено выходит свободно!)
// крепление: 2xМ4 сверху сквозь ШТАТНЫЕ отверстия дна -> закладные гайки в печатной пробке
const f2h=new THREE.Group(); f2h.position.set(0,131,0); J2.pivot.add(f2h);  // дно 131..133.5
fork(f2h,72);                                                                // ось J3 в верхнем Ø14
tubeCorners(J2.pivot);
const J3=jointModule(f2h,72);
const f3h=new THREE.Group(); f3h.position.set(0,131,0); J3.pivot.add(f3h);  // вилка-3
fork(f3h,72);
tubeCorners(J3.pivot);
const J4=jointModule(f3h,72);
// конец руки: NEMA14 (кисть J5, потом)
const gN14=G('n14'); J4.pivot.add(gN14);
box(35,28,35,mat.n14,0,116,9,gN14); box(10,3,10,mat.shaft,0,132,9,gN14);

// ============ управление/муфты ============
let printedMode=true;
function applyCoup(){ for(const c of couplers){ c.p.visible=printedMode; c.m.visible=!printedMode; }
  document.getElementById('mswap').textContent='Муфты: '+(printedMode?'ПЕЧАТНЫЕ (PETG)':'МЕТАЛЛИЧЕСКИЕ')+' — переключить';
  document.querySelectorAll('.item').forEach(el=>{                  // в списке — только актуальная муфта
    if(el.dataset.k==='coupP') el.style.display=printedMode?'':'none';
    if(el.dataset.k==='coupM') el.style.display=printedMode?'none':''; }); }
document.getElementById('mswap').onclick=()=>{printedMode=!printedMode;applyCoup();};
let autoOrbit=false;
document.getElementById('orbit').onclick=()=>{autoOrbit=!autoOrbit;
  document.getElementById('orbit').textContent='✈ Облёт камерой: '+(autoOrbit?'ВКЛ':'ВЫКЛ');};

const target=new THREE.Vector3(0,220,0);
let th=0.9,ph=1.2,R=700,drag=0,px=0,py=0,moved=0;
function setCam(){cam.position.set(target.x+R*Math.sin(ph)*Math.cos(th),target.y+R*Math.cos(ph),target.z+R*Math.sin(ph)*Math.sin(th));cam.lookAt(target);}
addEventListener('mousedown',e=>{if(e.target.closest('.panel'))return;drag=e.button===2?2:1;px=e.clientX;py=e.clientY;moved=0});
addEventListener('mouseup',e=>{if(drag&&moved<5)pick(e);drag=0});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);px=e.clientX;py=e.clientY;
 if(drag===1){th+=dx*.006;ph=Math.min(2.9,Math.max(.2,ph-dy*.006));}
 else{const s=R*.0016;target.x-=dx*s*Math.cos(th-Math.PI/2);target.z-=dx*s*Math.sin(th-Math.PI/2);target.y+=dy*s;}
 setCam();});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();
 R=Math.min(2200,Math.max(150,R*(e.deltaY>0?1.12:0.9)));setCam();},{passive:false});
addEventListener('keydown',e=>{if(e.ctrlKey&&(e.key==='+'||e.key==='-'||e.key==='='))e.preventDefault();});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const list=document.getElementById('list'),card=document.getElementById('card');
let restore=[];
function select(key){
 restore.forEach(r=>r.mesh.material=r.m); restore=[];
 for(const g of allG) if(g.userData.bom===key)
  g.traverse(o=>{if(o.isMesh&&o.material.emissive){restore.push({mesh:o,m:o.material});
   o.material=o.material.clone();o.material.emissive.setHex(0x2a4a7a);}});
 const b=BOM[key]; if(!b) return;
 card.style.display='block';
 card.innerHTML='<div class="nm">'+b.n+'</div>'+b.d+'<br><b>'+b.s+'</b>';
 document.querySelectorAll('.item').forEach(el=>el.classList.toggle('sel',el.dataset.k===key));
}
for(const k in BOM){const el=document.createElement('div');el.className='item';el.dataset.k=k;
 el.innerHTML=BOM[k].n.split('(')[0].split('—')[0].slice(0,36)+'<span class="st">'+BOM[k].s.slice(0,2)+'</span>';
 el.onclick=()=>select(k);list.appendChild(el);}
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){mv.x=(e.clientX/innerWidth)*2-1;mv.y=-(e.clientY/innerHeight)*2+1;
 ray.setFromCamera(mv,cam);
 const hits=ray.intersectObjects(scene.children,true);
 for(const h of hits){let o=h.object;while(o){if(o.userData&&o.userData.bom){select(o.userData.bom);return;}o=o.parent;}}}

const S={};
for(const id of ['j1','j2','j3','j4']) S[id]=document.getElementById(id);
function upd(){
 g1.rotation.y=-S.j1.value*Math.PI/180;
 scb.rotation.set(0,0,0);
 J2.pivot.rotation.z=-S.j2.value*Math.PI/180;
 J3.pivot.rotation.z=-S.j3.value*Math.PI/180;
 J4.pivot.rotation.z=-S.j4.value*Math.PI/180;
 for(let i=1;i<=4;i++) document.getElementById('v'+i).textContent=S['j'+i].value+'°';
 // муфта J1 вращается с рукой
 j1c.rotation.y=g1.rotation.y;
}
for(const id in S) S[id].oninput=upd;
upd(); setCam();
(function loop(){requestAnimationFrame(loop);
 if(autoOrbit){th+=0.004;setCam();}
 renderer.render(scene,cam);})();
</script>
</body>
</html>
