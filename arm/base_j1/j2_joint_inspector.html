<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Инспектор стыка J2 — V7/T5, сборка и размеры</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1d23;font-family:Segoe UI,Arial,sans-serif;color:#e8eaf0}
  #main{position:absolute;left:360px;top:0;right:0;bottom:0}
  #side{position:absolute;left:0;top:0;width:360px;bottom:0;background:#20242c;border-right:1px solid #333a46;display:flex;flex-direction:column}
  #list{overflow:auto;padding:6px;flex:0 0 auto;max-height:34%}
  .item{padding:5px 9px;border-radius:6px;font-size:12.5px;cursor:pointer;margin:2px 0}
  .item:hover{background:#2a3140}.item.sel{background:#33507a}
  #desc{padding:8px 12px;font-size:12.5px;line-height:1.55;border-top:1px solid #333a46;overflow:auto;flex:0 0 auto;max-height:26%}
  #desc .nm{font-weight:700;color:#ffce6b}
  #insp{flex:1;position:relative;border-top:1px solid #333a46;min-height:200px}
  #ihint{position:absolute;bottom:6px;left:10px;font-size:11px;color:#8f97a5;z-index:5}
  h2{font-size:13.5px;margin:8px 10px 2px}
  #mpanel{position:absolute;right:12px;top:10px;background:rgba(28,32,40,.92);padding:10px 14px;border-radius:8px;font-size:12px;color:#aeb6c4;z-index:5;width:230px}
  input[type=range]{width:100%}
</style>
</head>
<body>
<div id="side">
  <h2>🔩 Стык J2/J5 — актуальный мост V7/T5</h2>
  <div id="list"></div>
  <div id="desc"><span class="nm">Кликни деталь</span> — здесь будет объяснение, как она крепится, а внизу — она в 3D со всеми размерами.</div>
  <div id="insp"><div id="ihint">вращать мышью · колесо зум</div></div>
</div>
<div id="main">
  <div id="mpanel">
    <b>СБОРКА</b>: ЛКМ вращать · колесо зум · ПКМ сдвиг · клик по детали = выбрать её<br><br>
    РАЗНЕСТИ (взрыв-схема):<br><input id="ex" type="range" min="0" max="30" value="0">
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const M=(c,o)=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.35,transparent:o!==undefined,opacity:o===undefined?1:o});
const mat={alu:M(0xc8ccd2,.30),aluS:M(0xc8ccd2),steel:M(0xdfe3e8),dark:M(0x191c21),
  printed:M(0xe0912b),bolt:M(0xd8b23a),tube:M(0xb4bac2,.30),tubeS:M(0xb4bac2),
  cass:M(0xd97a2b),mag:M(0xc02626),bear:M(0x6a7280),bearD:M(0x23262c)};

function box(g,m,w,h,d,x,y,z,rz){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);if(rz)o.rotation.z=rz;g.add(o);return o}
function cylZ(g,m,dia,h,x,y,zc){const o=new THREE.Mesh(new THREE.CylinderGeometry(dia/2,dia/2,h,32),m);o.rotation.x=Math.PI/2;o.position.set(x,y,zc);g.add(o);return o}
function hexZ(g,m,af,h,x,y,zc){const o=new THREE.Mesh(new THREE.CylinderGeometry(af/1.732,af/1.732,h,6),m);o.rotation.x=Math.PI/2;o.position.set(x,y,zc);g.add(o);return o}
function coneZ(g,m,dBig,dSmall,h,x,y,zc){const o=new THREE.Mesh(new THREE.CylinderGeometry(dSmall/2,dBig/2,h,24),m);o.rotation.x=Math.PI/2;o.position.set(x,y,zc);g.add(o);return o}
function cylR(g,m,dia,h,x,y,zc,ang){const o=new THREE.Mesh(new THREE.CylinderGeometry(dia/2,dia/2,h,20),m);o.rotation.z=ang||0;o.position.set(x,y,zc);g.add(o);return o}

function makeLabel(text,w){
  const c=document.createElement('canvas');c.width=768;c.height=110;
  const q=c.getContext('2d');q.fillStyle='rgba(18,22,28,0.92)';q.fillRect(0,0,768,110);
  q.strokeStyle='#ffce6b';q.lineWidth=5;q.strokeRect(3,3,762,104);
  q.fillStyle='#ffe9a8';q.font='bold 52px Segoe UI';q.textAlign='center';q.textBaseline='middle';
  q.fillText(text,384,55);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
  s.scale.set(w,w*110/768,1);return s;
}
function dim(g,p1,p2,text,off,w){
  off=off||[0,0,0];
  const P1=new THREE.Vector3(...p1),P2=new THREE.Vector3(...p2);
  const a=P1.clone().add(new THREE.Vector3(...off)),b=P2.clone().add(new THREE.Vector3(...off));
  const yel=new THREE.LineBasicMaterial({color:0xffce6b}),gr=new THREE.LineBasicMaterial({color:0x717a88});
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),yel));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P1,a]),gr));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P2,b]),gr));
  const lbl=makeLabel(text,w||Math.max(14,a.distanceTo(b)));
  lbl.position.copy(a.clone().add(b).multiplyScalar(.5));g.add(lbl);
}

// ============================================================================
// СТЕК ПО Z (реальные высоты, муфта 12.8!):
// стенка А [-24..-21.5] | вал до -13 | муфта: хаб[-21..-10.2] фланец[-10.2..-8.2]
// МОСТ V5/T5 [-8.2..-3.2] | труба [-3.2..16.8] | кассета [-1.7..14.9]
// зазор 16.8..21.5 = 4.7мм | стенка Б [21.5..24] | ромб снаружи (наискось -27°)
// ============================================================================
const TILT=-0.464; // наклон ромба ~27° как в реале
const PARTS={}; const ORDER=[];
function def(key,name,desc,build,exDir){PARTS[key]={name,desc,build,exDir:exDir||0};ORDER.push(key)}

def('wallA','Стенка А скобы + вал редуктора',
 'Контекст: за этой стенкой адаптер и редуктор (уже собрано у тебя). Вал Ø8 с лысками торчит внутрь скобы на ~8.5 мм — на него садится муфта.',
 (g,solo)=>{
  box(g,solo?mat.aluS:mat.alu,50,60,2.5,0,0,-22.75);
  cylZ(g,mat.steel,8,11,0,0,-18.5);
  if(solo){
    dim(g,[0,0,-24],[0,0,-13],'вал Ø8, торчит ~8.5-11',[16,0,0]);
    dim(g,[0,-30,-22.75],[0,30,-22.75],'стенка 2.5 мм',[-30,0,0]);
  }},-1.6);

def('mcoup','Муфта металлическая (на валу)',
 'Садится бором на вал, 2 установочных винта — В ЦЕНТР ЛЫСКИ, с фиксатором резьбы. По цифровому замеру: фланец Ø21.8, 4 отверстия около Ø3.5 на BC16.5 — крепёж М3. Фланец прижимается к мосту четырьмя М3×7.',
 (g,solo)=>{
  cylZ(g,mat.steel,14.1,10.8,0,0,-15.6);            // хаб -21..-10.2
  cylZ(g,mat.steel,21.8,2,0,0,-9.2);                // фланец -10.2..-8.2
  cylZ(g,mat.dark,8.05,11.2,0,0,-15.6);             // бор
  for(const a of [45,135,225,315]){const x=8.25*Math.cos(a*Math.PI/180),y=8.25*Math.sin(a*Math.PI/180);
    cylZ(g,mat.dark,3.5,2.4,x,y,-9.2);}
  cylR(g,mat.bolt,3.5,3.5,0,7.9,-15.6,0);           // setscrew радиально (вдоль Y)
  cylR(g,mat.bolt,3.5,3.5,7.9,0,-15.6,Math.PI/2);   // второй setscrew
  if(solo){
    dim(g,[-10.9,0,-8.2],[10.9,0,-8.2],'фланец Ø21.8 × 2',[0,-17,0]);
    dim(g,[-7.05,0,-17],[7.05,0,-17],'хаб Ø14.1',[0,15,0]);
    dim(g,[10.9,0,-21],[10.9,0,-8.2],'высота 12.8',[8,0,0]);
    dim(g,[-4,0,-21],[4,0,-21],'бор Ø8 (лыски 5.9)',[0,-14,0],26);
    dim(g,[5.83,5.83,-8.2],[-5.83,-5.83,-8.2],'4 отв. Ø3.5, BC16.5 (цифровой замер)',[0,0,9],34);
  }},-1.1);

def('bF','Болт М3×7 ×4 + гайка М3 (муфта→мост)',
 'Исправление V7: это М3, а не М4. Оптимально М3×7; имеющиеся М3×10 можно подрезать до 7 мм. После V6 номинальный межцентр вынесен ещё на 5%, до 21.0 мм.',
 (g,solo)=>{
  cylZ(g,mat.bolt,5.5,3,0,0,-11.7);                 // голова М3
  hexZ(g,mat.dark,2.5,1.6,0,0,-12.5);
  cylZ(g,mat.bolt,3,7,0,0,-6.7);                    // стержень М3×7
  hexZ(g,mat.bolt,5.5,2.4,0,0,-4.4);                // гайка М3 в пазу
  if(solo){
    dim(g,[0,0,-10.2],[0,0,-3.2],'стержень 7 мм, Ø3 (М3×7)',[13,0,0],38);
    dim(g,[-2.75,0,-13.2],[2.75,0,-13.2],'голова Ø5.5 × 3, hex 2.5',[0,-11,0],28);
    dim(g,[-3,0,-4.4],[3,0,-4.4],'гайка М3: s5.5 × 2.4',[0,11,0],26);
  }},-0.7);

def('bridge','МОСТ печатный V7/T5 40×56×5',
 'Финальная готовая форма без отдельного пробника: после V6 крепёж муфты вынесен ещё на 5%. Расчётная цель BC20.963, номинально 21.0 мм. Пазы V7 принимают BC18.0–24.0 мм. Трубная часть не менялась: М4 на ±21.5.',
 (g,solo)=>{
  box(g,mat.printed,40,56,5,0,0,-5.7);              // -8.2..-3.2
  cylZ(g,mat.dark,9.2,5.6,0,0,-5.7);
  for(const a of [45,135,225,315]){const ar=a*Math.PI/180,ux=Math.cos(ar),uy=Math.sin(ar);
    for(const r of [9.0,12.0]) cylZ(g,mat.dark,4.0,5.8,r*ux,r*uy,-5.7);
    box(g,mat.dark,3.0,4.0,5.8,10.5*ux,10.5*uy,-5.7,ar);}
  for(const s of [-1,1]){cylZ(g,mat.dark,4.4,5.8,0,s*21.5,-5.7);cylZ(g,mat.dark,8.4,3,0,s*21.5,-6.7);}
  if(solo){
    dim(g,[-20,-28,-8.2],[20,-28,-8.2],'40',[0,-9,0]);
    dim(g,[20,-28,-8.2],[20,28,-8.2],'56',[9,0,0]);
    dim(g,[-20,28,-8.2],[-20,28,-3.2],'толщина 5',[-7,4,0],18);
    dim(g,[6.36,6.36,-3.2],[8.49,8.49,-3.2],'V7 СЛОТ 4.0: BC 18.0–24.0 (М3)',[14,14,7],44);
    dim(g,[0,21.5,-3.2],[0,-21.5,-3.2],'трубные отв: межцентр 43 (вне муфты!), Ø4.4 + цековка 8.4',[26,0,0],56);
    dim(g,[-4.6,0,-5.7],[4.6,0,-5.7],'центр Ø9.2',[0,-14,-6],22);
  }},-0.35);

def('bT','Болт М4×16 ×2 (мост→труба→кассета)',
 'v4: болты на ±21.5 от оси — крутятся свободно, муфта не нависает. Голова в цековке моста (со стороны муфты), стержень сквозь мост (5) и ближнюю стенку трубы (1.5), закручивается в ГАЙКУ через ШАЙБУ внутри КАССЕТЫ. Хвост уходит в канал кассеты. Снаружи трубы НЕ ТОРЧИТ НИЧЕГО.',
 (g,solo)=>{
  cylZ(g,mat.bolt,7,2.8,0,0,-6.8);                  // голова в цековке -8.2..-5.4
  cylZ(g,mat.bolt,4,16,0,0,2.6);                    // стержень -5.4..10.6
  if(solo){
    dim(g,[0,0,-5.4],[0,0,10.6],'стержень 16 мм, Ø4',[13,0,0]);
    dim(g,[-3.5,0,-8.2],[3.5,0,-8.2],'голова Ø7×2.8 — в цековке моста',[0,-12,0],34);
    dim(g,[0,0,7],[0,0,10.6],'этот хвост — внутри трубы, никому не мешает',[0,15,0],46);
  }},-0.35);

def('tube','Труба-звено 20×20×1.5 (140 мм)',
 'Твой алюминиевый бокс. v4: болты по кондуктору v4 на 8.5 и 51.5 от торца (Ø4.2) + Ø8.2 на 30 (ось-пруток) — НАСКВОЗЬ. Старые отверстия 14/46 остаются пустыми — не мешают. Показан низ трубы; вверх она идёт к следующему узлу.',
 (g,solo)=>{
  box(g,solo?mat.tubeS:mat.tube,20,100,20,0,20,6.8);   // низ y=-30, Т5: труба -3.2..16.8
  box(g,mat.tubeS,20,100,1.5,0,20,-2.45);              // ближняя стенка выделена
  for(const yy of [-21.5,21.5]) cylZ(g,mat.dark,4.2,2,0,yy,-2.45);
  cylZ(g,mat.dark,8.2,2,0,0,-2.45);
  if(solo){
    dim(g,[-10,-30,-3],[10,-30,-3],'20×20, стенка 1.5',[0,-11,0],34);
    dim(g,[13,-30,-2.5],[13,-21.5,-2.5],'8.5 → Ø4.2',[5,0,0],24);
    dim(g,[16,-30,-2.5],[16,0,-2.5],'30 → Ø8.2 (ОСЬ)',[8,0,0],30);
    dim(g,[19,-30,-2.5],[19,21.5,-2.5],'51.5 → Ø4.2',[11,0,0],24);
  }},0);

def('cass','КАССЕТА-распорка v4 + 2 гайки + 2 шайбы М4',
 'Печатный брусок, ВДВИГАЕТСЯ в трубу с нижнего торца. v4: в каждое гнездо С НАРУЖНОЙ грани СНАЧАЛА кладёшь ШАЙБУ М4 (карман Ø9.8×1.1 у стенки), потом ГАЙКУ (плотный hex-карман под ключ 7) — и только затем задвигаешь брусок в трубу. Болт тянет сталь по стали: голова→мост→стенка→шайба→гайка, пластик момент затяжки не держит. Брусок упирается в ОБЕ стенки — трубу не сминает. Насквозь проходит пруток-ось.',
 (g,solo)=>{
  box(g,mat.cass,16.6,60,16.6,0,0,6.6);             // y -30..30, z -1.7..14.9
  for(const yy of [-21.5,21.5]){cylZ(g,mat.dark,9.8,1.2,0,yy,-1.1);cylZ(g,mat.bolt,9,0.8,0,yy,-1.2);hexZ(g,mat.dark,7.35,3.5,0,yy,1.2);hexZ(g,mat.bolt,7,3.2,0,yy,1.15);}
  cylZ(g,mat.dark,9.2,17,0,0,6.6);
  if(solo){
    dim(g,[-8.3,-30,-1.7],[8.3,-30,-1.7],'16.6 (в просвет трубы 17)',[0,-11,0],40);
    dim(g,[10,-30,-1.2],[10,30,-1.2],'длина 60',[6,0,0],22);
    dim(g,[8.3,30,-1.7],[8.3,30,14.9],'высота 16.6 — РАСПОРКА в обе стенки',[7,6,0],46);
    dim(g,[0,-21.5,-1.7],[0,21.5,-1.7],'ШАЙБА+ГАЙКА: на 8.5 и 51.5 от торца (шаг 43)',[-26,0,0],54);
    dim(g,[-4.6,0,7],[4.6,0,7],'сквозной Ø9.2 — тут проходит пруток',[0,13,4],40);
  }},0.35);

def('rod','Пруток-ось Ø8 × 36 + магнит',
 'Режется из твоего Д16Т 8×200. Т5: длина 36 (труба уехала на 3 к муфте, 33 — впритык, но сойдёт если уже отрезан). Вставляется С ДАЛЬНЕЙ стороны: сквозь дальнюю стенку трубы → через кассету → до упора. Дальний конец входит в бор подшипника, там зажимается его установочными винтами М3. В торец клеится магнит для датчика AS5600.',
 (g,solo)=>{
  cylZ(g,mat.steel,8,36,0,0,16.3);                  // -1.7..34.3
  cylZ(g,mat.mag,6,2.5,0,0,35.6);
  if(solo){
    dim(g,[0,0,-1.7],[0,0,34.3],'длина 36 мм (33 сойдёт)',[13,0,0],36);
    dim(g,[-4,0,-1.7],[4,0,-1.7],'Ø8',[0,-10,0],14);
    dim(g,[-3,0,37],[3,0,37],'магнит Ø6×2.5 (клей в торец)',[0,11,0],40);
  }},0.8);

def('wallB','Стенка Б (Т5: БЕЗ доработок!)',
 'Т5: мост тонкий → труба уехала на 3 мм к муфте, зазор труба↔стенка теперь 4.7 мм. Голова обычного болта (4 мм) свободно помещается — НИКАКОЙ зенковки, никаких потайных винтов. Отверстия сетки используются как есть.',
 (g,solo)=>{
  box(g,solo?mat.aluS:mat.alu,50,60,2.5,0,0,22.75);
  cylZ(g,mat.dark,14,2.7,0,0,22.75);
  const c=Math.cos(TILT),s=Math.sin(TILT);
  for(const t of [-1,1]) cylZ(g,mat.dark,5,2.7,18*c*t,18*s*t,22.75);
  if(solo){
    dim(g,[0,0,21.5],[0,0,24],'толщина 2.5 · до трубы 4.7 — голова влезает',[26,10,0],56);
    dim(g,[16*1,-7.4*1,21.5],[-16,7.4,21.5],'2 отв. Ø5 на диагонали — КАК ЕСТЬ',[0,-22,-6],50);
    dim(g,[-7,0,21.5],[7,0,21.5],'центр Ø14 — сквозь него пруток',[0,24,-4],40);
  }},1.35);

def('bear','ПОДШИПНИК-РОМБ наискось + М4×16 обычные + гайки',
 'Стоит СНАРУЖИ стенки, НАИСКОСЬ ~27° — его уши (межцентр 36) так попадают в диагональные отверстия сетки скобы. Т5-крепёж: ОБЫЧНЫЙ М4×16 (есть в наличии) ИЗНУТРИ скобы — голова 4 мм помещается в зазоре 4.7 → сквозь стенку → сквозь ухо → гайка М4 снаружи на ухе, хвост торчит наружу, никому не мешает. Пруток входит в бор, зажимается 2 установочными М3.',
 (g,solo)=>{
  const grp=new THREE.Group(); grp.rotation.z=TILT; g.add(grp);
  cylZ(grp,mat.bear,27,4,0,0,26);
  for(const t of [-1,1]){cylZ(grp,mat.bear,13.5,4,18*t,0,26);box(grp,mat.bear,24,15,4,9*t,0,26);}
  cylZ(grp,mat.bearD,28,6.5,0,0,29);
  cylZ(grp,mat.steel,19,9,0,0,30.5);
  cylZ(grp,mat.dark,8.05,9.5,0,0,30.5);
  cylR(grp,mat.bolt,3,3,0,10.5,31,0);               // устан. М3
  for(const t of [-1,1]){
    cylZ(grp,mat.bolt,7,4,18*t,0,19.5);             // обычная голова 4мм ВНУТРИ (зазор 4.7)
    cylZ(grp,mat.bolt,4,14,18*t,0,28.5);            // стержень М4×16 сквозь стенку+ухо
    hexZ(grp,mat.bolt,7,3.2,18*t,0,29.7);           // гайка на ухе
  }
  if(solo){
    dim(g,[-24*Math.cos(TILT),-24*Math.sin(TILT),24],[24*Math.cos(TILT),24*Math.sin(TILT),24],'фланец 48×27×4 — НАИСКОСЬ ~27°',[0,-24,0],56);
    dim(g,[18*Math.cos(TILT),18*Math.sin(TILT),28],[-18*Math.cos(TILT),-18*Math.sin(TILT),28],'уши: межцентр 36, отв Ø5',[0,22,4],44);
    dim(g,[-4,0,35],[4,0,35],'бор Ø8 · ступица 12.4 · 2× устан. М3',[0,15,2],52);
    dim(g,[18*Math.cos(TILT),18*Math.sin(TILT),17.5],[18*Math.cos(TILT),18*Math.sin(TILT),31.3],'пакет: голова 4 (в зазоре 4.7) | стенка 2.5 | ухо 4 | гайка',[14,-8,0],62);
  }},1.9);

// ================= ВЬЮПОРТЫ =================
function makeView(el){
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1d23);
  const cam=new THREE.PerspectiveCamera(50,1,0.5,3000);
  const ren=new THREE.WebGLRenderer({antialias:true});
  el.appendChild(ren.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,.62));
  const d1=new THREE.DirectionalLight(0xffffff,.7);d1.position.set(120,160,140);scene.add(d1);
  const d2=new THREE.DirectionalLight(0xa0b0ff,.28);d2.position.set(-140,60,-120);scene.add(d2);
  return {scene,cam,ren,el};
}
const mainV=makeView(document.getElementById('main'));
const inspV=makeView(document.getElementById('insp'));

// сборка
const asm=[];
function addAsm(key,px,py){
  const g=new THREE.Group();g.userData.key=key;
  PARTS[key].build(g,false);
  if(px!==undefined)g.position.set(px,py,0);
  g.userData.z0=0;
  mainV.scene.add(g);asm.push(g);
}
for(const key of ORDER){
  if(key==='bF'){for(const a of [45,135,225,315])addAsm(key,8.25*Math.cos(a*Math.PI/180),8.25*Math.sin(a*Math.PI/180));continue}
  if(key==='bT'){for(const s of [-1,1])addAsm(key,0,s*21.5);continue}
  addAsm(key);
}

// список/описание/инспектор
const listEl=document.getElementById('list'),descEl=document.getElementById('desc');
let inspGroup=null,selKey=null,iR=70;
function select(key){
  selKey=key;
  for(const el of listEl.children) el.classList.toggle('sel',el.dataset.k===key);
  descEl.innerHTML='<span class="nm">'+PARTS[key].name+'</span><br>'+PARTS[key].desc;
  if(inspGroup)inspV.scene.remove(inspGroup);
  inspGroup=new THREE.Group();
  PARTS[key].build(inspGroup,true);
  const bb=new THREE.Box3().setFromObject(inspGroup);
  inspGroup.position.sub(bb.getCenter(new THREE.Vector3()));
  inspV.scene.add(inspGroup);
  iR=Math.max(45,bb.getSize(new THREE.Vector3()).length()*1.15);updICam();
  for(const g of asm)g.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(g.userData.key===key?0x7a4d00:0x000000)});
}
for(const key of ORDER){
  const d=document.createElement('div');d.className='item';d.dataset.k=key;
  d.textContent=PARTS[key].name;d.onclick=()=>select(key);
  listEl.appendChild(d);
}

// взрыв
document.getElementById('ex').oninput=e=>{
  const v=+e.target.value;
  for(const g of asm) g.position.z=PARTS[g.userData.key].exDir*v;
};

// камеры
let mTh=-2.35,mPh=1.25,mR=150,mTgt=new THREE.Vector3(0,0,0);
function updMCam(){mainV.cam.position.set(mTgt.x+mR*Math.sin(mPh)*Math.cos(mTh),mTgt.y+mR*Math.cos(mPh),mTgt.z+mR*Math.sin(mPh)*Math.sin(mTh));mainV.cam.lookAt(mTgt)}
let iTh=0.7,iPh=1.15;
function updICam(){inspV.cam.position.set(iR*Math.sin(iPh)*Math.cos(iTh),iR*Math.cos(iPh),iR*Math.sin(iPh)*Math.sin(iTh));inspV.cam.lookAt(0,0,0)}
updMCam();updICam();
function orbit(v,get,set){
  let drag=null;
  v.ren.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,b:e.button}});
  addEventListener('pointerup',()=>drag=null);
  v.ren.domElement.addEventListener('pointermove',e=>{
    if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
    const s=get();
    if(drag.b===2&&s.tgt){const k=s.R/600;
      const rt=new THREE.Vector3().subVectors(v.cam.position,s.tgt).cross(v.cam.up).normalize();
      s.tgt.addScaledVector(rt,-dx*k);s.tgt.y+=dy*k;}
    else{s.th+=dx*0.008;s.ph=Math.min(2.9,Math.max(0.2,s.ph-dy*0.008));}
    set(s);
  });
  v.ren.domElement.addEventListener('wheel',e=>{const s=get();s.R=Math.min(900,Math.max(22,s.R*(e.deltaY>0?1.12:0.89)));set(s);e.preventDefault()},{passive:false});
  v.ren.domElement.addEventListener('contextmenu',e=>e.preventDefault());
}
orbit(mainV,()=>({th:mTh,ph:mPh,R:mR,tgt:mTgt}),s=>{mTh=s.th;mPh=s.ph;mR=s.R;updMCam()});
orbit(inspV,()=>({th:iTh,ph:iPh,R:iR}),s=>{iTh=s.th;iPh=s.ph;iR=s.R;updICam()});

// клик по сборке -> выбор (устойчивый: допуск 8px)
const ray=new THREE.Raycaster(),mo=new THREE.Vector2();ray.params.Line={threshold:2};
let dXY=null;
mainV.ren.domElement.addEventListener('pointerdown',e=>{dXY=[e.clientX,e.clientY]});
mainV.ren.domElement.addEventListener('pointerup',e=>{
  if(!dXY||Math.hypot(e.clientX-dXY[0],e.clientY-dXY[1])>8){dXY=null;return}
  const r=mainV.ren.domElement.getBoundingClientRect();
  mo.x=(e.clientX-r.left)/r.width*2-1;mo.y=-(e.clientY-r.top)/r.height*2+1;
  ray.setFromCamera(mo,mainV.cam);
  const hits=ray.intersectObjects(asm,true).filter(h=>h.object.type==='Mesh'&&!(h.object.material.transparent&&h.object.material.opacity<0.5));
  for(const h of hits){let o=h.object;while(o&&!o.userData.key)o=o.parent;
    if(o){select(o.userData.key);break}}
  dXY=null;
});

function resize(){
  for(const v of [mainV,inspV]){
    const b=v.el.getBoundingClientRect();
    v.ren.setSize(b.width,b.height);v.cam.aspect=b.width/Math.max(1,b.height);v.cam.updateProjectionMatrix();
  }
}
addEventListener('resize',resize);resize();
(function loop(){requestAnimationFrame(loop);
  if(inspGroup)inspGroup.rotation.y+=0.004;
  mainV.ren.render(mainV.scene,mainV.cam);
  inspV.ren.render(inspV.scene,inspV.cam);
})();
select('bear');
</script>
</body>
</html>
