<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111}
      .h{font:700 24px Arial,sans-serif;fill:#111}
      .t{font:19px Arial,sans-serif;fill:#111}
      .small{font:16px Arial,sans-serif;fill:#222}
      .warn{font:700 22px Arial,sans-serif;fill:#b00020}
      .fixed{fill:#eaf4ff;stroke:#1565c0;stroke-width:3;rx:10}
      .moving{fill:#eafbea;stroke:#1b7f36;stroke-width:3;rx:10}
      .gear{fill:#1f78d1;stroke:#0b3f7a;stroke-width:3;rx:12}
      .motor{fill:#333;stroke:#111;stroke-width:3;rx:8}
      .metal{fill:#cfd8dc;stroke:#555;stroke-width:3}
      .pcb{fill:#103d2c;stroke:#052016;stroke-width:3;rx:5}
      .magnet{fill:#c1121f;stroke:#111;stroke-width:3}
      .shaft{fill:#b0bec5;stroke:#333;stroke-width:3}
      .line{stroke:#111;stroke-width:3;marker-end:url(#arrow)}
      .dash{stroke-dasharray:10 8}
      .bad{fill:#fff0f0;stroke:#c1121f;stroke-width:3;rx:10}
      .ok{fill:#eefbea;stroke:#1b7f36;stroke-width:3;rx:10}
    </style>
  </defs>

  <rect width="1500" height="900" fill="#fff"/>
  <text x="45" y="58" class="title">Где ставить AS5600 в суставе</text>
  <text x="45" y="95" class="warn">AS5600 должен мерить выход сустава после редуктора, а не вал мотора.</text>

  <!-- good concept -->
  <rect x="55" y="145" width="640" height="650" class="ok"/>
  <text x="85" y="190" class="h">Правильно: датчик на выходе редуктора</text>

  <rect x="95" y="320" width="170" height="150" class="motor"/>
  <text x="125" y="405" class="small" fill="#fff">NEMA17</text>
  <rect x="265" y="290" width="185" height="210" class="gear"/>
  <text x="305" y="385" class="small" fill="#fff">CM36</text>
  <text x="295" y="412" class="small" fill="#fff">1:71</text>
  <rect x="450" y="365" width="130" height="55" class="shaft"/>
  <rect x="575" y="300" width="78" height="185" class="moving"/>
  <text x="586" y="395" class="small">хаб</text>
  <rect x="585" y="220" width="55" height="80" class="magnet"/>
  <text x="565" y="205" class="small">магнит</text>
  <rect x="520" y="115" width="150" height="80" class="pcb"/>
  <text x="545" y="162" class="small" fill="#fff">AS5600</text>
  <line x1="613" y1="220" x2="613" y2="195" stroke="#111" stroke-width="4"/>
  <text x="465" y="245" class="small">зазор 1-2 мм, строго по центру чипа</text>
  <rect x="85" y="560" width="250" height="130" class="fixed"/>
  <text x="115" y="607" class="small">неподвижная часть</text>
  <text x="115" y="634" class="small">сустава / корпус</text>
  <line x1="335" y1="600" x2="520" y2="165" class="line"/>
  <rect x="360" y="560" width="250" height="130" class="moving"/>
  <text x="390" y="607" class="small">вращающаяся часть</text>
  <text x="390" y="634" class="small">рычаг / плечо</text>
  <line x1="500" y1="560" x2="613" y2="300" class="line"/>

  <!-- bad concept -->
  <rect x="780" y="145" width="640" height="650" class="bad"/>
  <text x="810" y="190" class="h">Плохо: датчик болтается или стоит на моторе</text>

  <rect x="825" y="330" width="170" height="150" class="motor"/>
  <text x="855" y="415" class="small" fill="#fff">NEMA17</text>
  <rect x="995" y="300" width="185" height="210" class="gear"/>
  <text x="1035" y="395" class="small" fill="#fff">CM36</text>
  <rect x="1180" y="375" width="130" height="55" class="shaft"/>
  <rect x="890" y="235" width="55" height="80" class="magnet"/>
  <rect x="830" y="135" width="150" height="80" class="pcb"/>
  <text x="855" y="182" class="small" fill="#fff">AS5600</text>
  <line x1="918" y1="235" x2="918" y2="215" stroke="#111" stroke-width="4"/>
  <text x="810" y="550" class="t">Почему плохо:</text>
  <text x="810" y="590" class="small">1. вал мотора не равен углу плеча из-за редуктора и люфта;</text>
  <text x="810" y="620" class="small">2. датчик в руке не имеет стабильного центра/зазора;</text>
  <text x="810" y="650" class="small">3. ИИ/софт будет видеть неправильную позу сустава.</text>

  <rect x="65" y="825" width="1360" height="45" fill="#f7f7f7" stroke="#333" stroke-width="2" rx="8"/>
  <text x="90" y="855" class="t">Правило для каждого сустава: магнит жестко на вращающемся выходном хабе, AS5600 жестко на неподвижном корпусе, оси совпадают.</text>
</svg>
