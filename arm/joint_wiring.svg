<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1080" viewBox="0 0 1300 1080" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1300" height="1080" fill="#f8fafc"/>

  <!-- Title -->
  <text x="650" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Схема ОДНОГО сустава роборуки</text>
  <text x="650" y="70" text-anchor="middle" font-size="15" fill="#475569">NEMA17 + редуктор CM36 1:71 · драйвер TMC2209 · энкодер AS5600 · ESP32-S3 · БП 12–24В</text>

  <!-- ================= NOTES BOX ================= -->
  <rect x="60" y="92" width="250" height="205" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="75" y="116" font-size="14" font-weight="700" fill="#9a3412">3 ПРАВИЛА</text>
  <text x="75" y="142" font-size="12.5" fill="#7c2d12">1. Мотор НЕ касается БП —</text>
  <text x="90" y="160" font-size="12.5" fill="#7c2d12">только через драйвер.</text>
  <text x="75" y="186" font-size="12.5" fill="#7c2d12">2. Питание 12–24В и логика</text>
  <text x="90" y="204" font-size="12.5" fill="#7c2d12">3.3В — раздельны, но GND</text>
  <text x="90" y="222" font-size="12.5" fill="#7c2d12">общий (одна точка).</text>
  <text x="75" y="248" font-size="12.5" fill="#7c2d12">3. AS5600 — на ВЫХОДЕ</text>
  <text x="90" y="266" font-size="12.5" fill="#7c2d12">сустава (после редуктора),</text>
  <text x="90" y="284" font-size="12.5" fill="#7c2d12">не на моторе.</text>

  <!-- ================= MECH TOWER ================= -->
  <rect x="60" y="320" width="340" height="575" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">МЕХАНИКА СУСТАВА (снизу вверх)</text>

  <!-- next link -->
  <rect x="135" y="362" width="190" height="38" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="230" y="386" text-anchor="middle" font-size="12.5" fill="#1e3a8a">звено (алюм. балка)</text>

  <!-- AS5600 -->
  <rect x="115" y="430" width="220" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="225" y="460" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">AS5600</text>
  <text x="225" y="482" text-anchor="middle" font-size="12" fill="#92400e">читает угол сустава (абсолютно)</text>
  <text x="225" y="500" text-anchor="middle" font-size="11" fill="#b45309">+ VCC 3.3В · GND общий · DIR→GND</text>

  <!-- gap + magnet -->
  <line x1="225" y1="512" x2="225" y2="548" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="535" font-size="10.5" fill="#64748b">зазор 1–3 мм</text>
  <circle cx="225" cy="556" r="9" fill="#dc2626"/>
  <text x="242" y="560" font-size="11" fill="#dc2626">магнит (на оси вращения)</text>
  <text x="225" y="584" text-anchor="middle" font-size="11" fill="#475569">выходной вал редуктора</text>

  <!-- gearbox -->
  <rect x="140" y="596" width="170" height="88" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="225" y="632" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Редуктор CM36</text>
  <text x="225" y="654" text-anchor="middle" font-size="13" fill="#334155">1 : 71</text>
  <text x="225" y="674" text-anchor="middle" font-size="10.5" fill="#64748b">умножает момент</text>

  <!-- motor -->
  <rect x="120" y="732" width="210" height="100" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="225" y="772" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">NEMA17</text>
  <text x="225" y="793" text-anchor="middle" font-size="12" fill="#334155">шаговый мотор</text>
  <text x="225" y="812" text-anchor="middle" font-size="11" fill="#64748b">4 провода = 2 катушки</text>

  <!-- vertical mech connectors -->
  <line x1="225" y1="400" x2="225" y2="430" stroke="#94a3b8" stroke-width="2"/>
  <line x1="225" y1="684" x2="225" y2="732" stroke="#94a3b8" stroke-width="6"/>

  <!-- motor wire exits -->
  <circle cx="330" cy="758" r="3" fill="#2563eb"/>
  <circle cx="330" cy="778" r="3" fill="#2563eb"/>
  <circle cx="330" cy="800" r="3" fill="#16a34a"/>
  <circle cx="330" cy="820" r="3" fill="#16a34a"/>

  <!-- ================= POWER SUPPLY ================= -->
  <rect x="555" y="150" width="250" height="95" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="555" y="150" width="250" height="38" rx="10" fill="#dc2626"/>
  <rect x="555" y="170" width="250" height="18" fill="#dc2626"/>
  <text x="680" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">БЛОК ПИТАНИЯ 12–24В</text>
  <text x="640" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">(+)</text>
  <text x="735" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">(GND)</text>
  <circle cx="640" cy="245" r="4" fill="#dc2626"/>
  <circle cx="735" cy="245" r="4" fill="#334155"/>

  <!-- ================= TMC2209 ================= -->
  <rect x="560" y="560" width="250" height="290" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="560" y="560" width="250" height="40" rx="10" fill="#2563eb"/>
  <rect x="560" y="580" width="250" height="20" fill="#2563eb"/>
  <text x="685" y="587" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TMC2209 (драйвер)</text>

  <!-- TMC pins: VM top, GND bottom -->
  <circle cx="640" cy="560" r="4" fill="#dc2626"/>
  <text x="640" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">VM</text>
  <circle cx="640" cy="850" r="4" fill="#334155"/>
  <text x="655" y="843" font-size="12" font-weight="700" fill="#334155">GND</text>

  <!-- TMC motor pins (left) -->
  <circle cx="560" cy="635" r="4" fill="#2563eb"/><text x="575" y="639" font-size="11.5" fill="#1e3a8a">M1A</text>
  <circle cx="560" cy="668" r="4" fill="#2563eb"/><text x="575" y="672" font-size="11.5" fill="#1e3a8a">M1B</text>
  <circle cx="560" cy="701" r="4" fill="#16a34a"/><text x="575" y="705" font-size="11.5" fill="#166534">M2A</text>
  <circle cx="560" cy="734" r="4" fill="#16a34a"/><text x="575" y="738" font-size="11.5" fill="#166534">M2B</text>

  <!-- TMC control pins (right) -->
  <circle cx="810" cy="635" r="4" fill="#f59e0b"/><text x="805" y="639" text-anchor="end" font-size="11.5" fill="#b45309">VIO</text>
  <circle cx="810" cy="668" r="4" fill="#7c3aed"/><text x="805" y="672" text-anchor="end" font-size="11.5" fill="#5b21b6">STEP</text>
  <circle cx="810" cy="700" r="4" fill="#7c3aed"/><text x="805" y="704" text-anchor="end" font-size="11.5" fill="#5b21b6">DIR</text>
  <circle cx="810" cy="732" r="4" fill="#7c3aed"/><text x="805" y="736" text-anchor="end" font-size="11.5" fill="#5b21b6">EN</text>
  <circle cx="810" cy="764" r="4" fill="#7c3aed"/><text x="805" y="768" text-anchor="end" font-size="11.5" fill="#5b21b6">UART</text>

  <!-- ================= ESP32 ================= -->
  <rect x="980" y="450" width="290" height="360" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="980" y="450" width="290" height="40" rx="10" fill="#16a34a"/>
  <rect x="980" y="470" width="290" height="20" fill="#16a34a"/>
  <text x="1125" y="477" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ESP32-S3 (мозг)</text>

  <circle cx="980" cy="520" r="4" fill="#f59e0b"/><text x="995" y="524" font-size="11.5" fill="#b45309">3.3В</text>
  <circle cx="980" cy="553" r="4" fill="#334155"/><text x="995" y="557" font-size="11.5" fill="#334155">GND</text>
  <circle cx="980" cy="610" r="4" fill="#7c3aed"/><text x="995" y="614" font-size="11.5" fill="#5b21b6">STEP</text>
  <circle cx="980" cy="642" r="4" fill="#7c3aed"/><text x="995" y="646" font-size="11.5" fill="#5b21b6">DIR</text>
  <circle cx="980" cy="674" r="4" fill="#7c3aed"/><text x="995" y="678" font-size="11.5" fill="#5b21b6">EN</text>
  <circle cx="980" cy="706" r="4" fill="#7c3aed"/><text x="995" y="710" font-size="11.5" fill="#5b21b6">UART</text>
  <circle cx="980" cy="752" r="4" fill="#0891b2"/><text x="995" y="756" font-size="11.5" fill="#155e75">SDA</text>
  <circle cx="980" cy="778" r="4" fill="#0891b2"/><text x="995" y="782" font-size="11.5" fill="#155e75">SCL</text>
  <text x="1125" y="805" text-anchor="middle" font-size="11" fill="#64748b">питание: USB (сейчас) / DC-DC (на платформе)</text>

  <!-- ================= WIRES ================= -->
  <!-- Power + : PSU(+) -> TMC VM -->
  <polyline points="640,245 640,560" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="650" y="410" font-size="12" font-weight="700" fill="#dc2626">+12–24В</text>

  <!-- Motor coils -->
  <polyline points="560,635 460,635 460,758 330,758" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="560,668 445,668 445,778 330,778" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="560,701 430,701 430,800 330,800" fill="none" stroke="#16a34a" stroke-width="3"/>
  <polyline points="560,734 415,734 415,820 330,820" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="470" y="700" font-size="11.5" font-weight="700" fill="#1e3a8a">катушка A</text>
  <text x="360" y="854" font-size="11.5" font-weight="700" fill="#166534">катушка B</text>

  <!-- 3.3V logic: ESP32 -> TMC VIO -->
  <polyline points="980,520 900,520 900,635 810,635" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="905" y="512" font-size="11" fill="#b45309">3.3В (VIO)</text>

  <!-- control signals: ESP32 -> TMC -->
  <polyline points="980,610 892,610 892,668 810,668" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polyline points="980,642 878,642 878,700 810,700" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polyline points="980,674 864,674 864,732 810,732" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polyline points="980,706 850,706 850,764 810,764" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="838" y="600" font-size="11" font-weight="700" fill="#5b21b6">STEP / DIR / EN / UART</text>

  <!-- I2C: ESP32 SDA/SCL -> AS5600 (over the top) -->
  <polyline points="980,752 935,752 935,112 348,112 348,455 335,455" fill="none" stroke="#0891b2" stroke-width="2.5"/>
  <polyline points="980,778 920,778 920,128 362,128 362,478 335,478" fill="none" stroke="#0891b2" stroke-width="2.5"/>
  <text x="560" y="105" font-size="12" font-weight="700" fill="#155e75">I2C: SDA / SCL  (энкодер → ESP32)</text>

  <!-- ================= GROUND BUS ================= -->
  <line x1="120" y1="915" x2="1180" y2="915" stroke="#111827" stroke-width="6"/>
  <text x="130" y="905" font-size="13" font-weight="700" fill="#111827">ОБЩАЯ ЗЕМЛЯ (GND) — всё в одну точку</text>

  <!-- GND drops -->
  <polyline points="735,245 735,285 470,285 470,915" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="478" y="500" font-size="11" fill="#334155">GND БП</text>
  <polyline points="640,850 640,915" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="648" y="895" font-size="11" fill="#334155">GND драйв.</text>
  <polyline points="980,553 930,553 930,915" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="938" y="895" font-size="11" fill="#334155">GND ESP32</text>

  <!-- ================= LEGEND ================= -->
  <rect x="60" y="948" width="1180" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="75" y="972" font-size="14" font-weight="700" fill="#0f172a">ЛЕГЕНДА ПРОВОДОВ</text>

  <line x1="80" y1="998" x2="120" y2="998" stroke="#dc2626" stroke-width="5"/>
  <text x="128" y="1002" font-size="12.5" fill="#334155">питание +12–24В (силовое)</text>

  <line x1="80" y1="1028" x2="120" y2="1028" stroke="#111827" stroke-width="5"/>
  <text x="128" y="1032" font-size="12.5" fill="#334155">общая земля GND</text>

  <line x1="360" y1="998" x2="400" y2="998" stroke="#2563eb" stroke-width="4"/>
  <text x="408" y="1002" font-size="12.5" fill="#334155">катушка A мотора</text>

  <line x1="360" y1="1028" x2="400" y2="1028" stroke="#16a34a" stroke-width="4"/>
  <text x="408" y="1032" font-size="12.5" fill="#334155">катушка B мотора</text>

  <line x1="620" y1="998" x2="660" y2="998" stroke="#f59e0b" stroke-width="4"/>
  <text x="668" y="1002" font-size="12.5" fill="#334155">3.3В логика (VIO / VCC энкодера)</text>

  <line x1="620" y1="1028" x2="660" y2="1028" stroke="#7c3aed" stroke-width="4"/>
  <text x="668" y="1032" font-size="12.5" fill="#334155">сигналы STEP / DIR / EN / UART → драйвер</text>

  <line x1="960" y1="998" x2="1000" y2="998" stroke="#0891b2" stroke-width="4"/>
  <text x="1008" y="1002" font-size="12.5" fill="#334155">I2C (SDA / SCL) энкодер → ESP32</text>

  <text x="960" y="1032" font-size="11.5" fill="#64748b">Для 5 моторов: между AS5600 и ESP32 — мультиплексор TCA9548A</text>
</svg>
